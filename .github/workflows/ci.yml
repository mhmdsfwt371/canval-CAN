# Runs the page tests on every push. A red mark here means a behaviour
# somebody relies on changed; the site still deploys, but you know.
name: tests
on: [push, pull_request]
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/ui.test.mjs
