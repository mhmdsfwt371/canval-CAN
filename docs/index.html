     "install app", and the PNG is for iOS, which ignores both the
     manifest icons and any SVG. No service worker on purpose -- the data
     is nightly and the network is always there, so a cache would only add
     a stale copy to explain. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23101619'/%3E%3Cg fill='none' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M8 22c8 0 8 20 16 20s8-20 16-20 8 20 16 20' stroke='%23E0A106'/%3E%3Cpath d='M8 42c8 0 8-20 16-20s8 20 16 20 8-20 16-20' stroke='%2312734A'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Colours off a CAN harness: ISO 11898 runs a twisted pair of yellow
   (CAN-H) and green (CAN-L). Those two wires are what this tool is about,
   so they are the only saturated colours on the page.

   Dark is not the light palette inverted. Both wire colours are lifted so
   they stay recognisable against a dark ground, and the ground is a warm
   charcoal rather than black so the yellow does not glare. */
:root{
  --ink:#101619; --paper:#E9ECE8; --panel:#fff; --line:#CFD5CE;
  --muted:#6A7580; --canh:#E0A106; --canl:#12734A; --alert:#A33227;
  --soft:#F5F6F4; --chip:#EEF3EF; --chipT:#20563C; --chipL:#D7E4DA;
  --chipN:#F7EDEC; --chipNT:#8A3229; --chipNL:#E9D2CF; --sel:#F0F2EF;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --ink:#E7EAE6; --paper:#15191B; --panel:#1C2124; --line:#2E3538;
  --muted:#95A0A6; --canh:#F0B93C; --canl:#3FA877; --alert:#E0705F;
  --soft:#222829; --chip:#1E2E27; --chipT:#7FCBA4; --chipL:#2C4438;
  --chipN:#33221F; --chipNT:#E39184; --chipNL:#4A2E29; --sel:#262D30;
}
/* Three sizes, cycled from one button. zoom scales everything at once --
   text, fields, touch targets -- which is exactly what seventy-year-old
   eyes and fingers need, with no second layout to maintain. */
html[data-zoom="1"]{zoom:1.15}
html[data-zoom="2"]{zoom:1.32}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background .18s ease,color .18s ease}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* ---------------- instrument bar ---------------- */
.bar{border-bottom:1px solid var(--line);background:var(--panel)}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-top:12px;padding-bottom:12px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:19px}
.brand span{color:var(--muted);font-weight:500;font-size:15px}
.brand .v{font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--canh);vertical-align:2px}
.gauges{margin-inline-start:auto;display:flex;gap:18px;flex-wrap:wrap}
.gauge{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.gauge b{color:var(--ink);font-weight:600;font-size:14px}
.tools{display:flex;gap:6px;align-items:center}
.tool{background:none;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:12px;
  font-weight:600;padding:5px 9px;line-height:1;display:flex;align-items:center;
  min-height:28px}
.tool:hover{border-color:var(--ink);color:var(--ink)}
.tool:focus-visible,.combo input:focus-visible,button:focus-visible{
  outline:2px solid var(--canh);outline-offset:2px}

/* ---------------- the three steps ---------------- */
.ask{padding:32px 0 8px}
.ask h1{margin:0 0 18px;font-size:clamp(24px,4vw,34px);font-weight:700;
  letter-spacing:-.03em;line-height:1.25}
.steps{display:grid;grid-template-columns:1.2fr 1.4fr .8fr auto;gap:10px;
  align-items:end}
@media(max-width:700px){.steps{grid-template-columns:1fr 1fr}}
.step label{display:block;font-family:var(--mono);font-size:11.5px;
  color:var(--muted);margin-bottom:5px;letter-spacing:.04em}

/* A dropdown of our own. The native datalist popup renders outside the
   page's world -- wrong width, wrong side, wrong colours in dark -- and
   there is no styling hook for it. This one is a box under its field. */
.combo{position:relative}
.combo input{
  width:100%;font-family:var(--sans);font-size:16px;font-weight:500;
  padding:12px 34px 12px 12px;border:1.5px solid var(--ink);border-radius:2px;
  background:var(--panel);color:var(--ink);
}
[dir="ltr"] .combo input{padding:12px 12px 12px 34px}
.combo input:disabled{border-color:var(--line);color:var(--muted);
  background:var(--soft);cursor:default}
.combo input::placeholder{color:var(--muted);font-weight:400;opacity:.75}
.combo .caret{position:absolute;inset-inline-end:12px;bottom:16px;
  pointer-events:none;color:var(--muted);font-size:10px;line-height:1}
.menu{
  position:absolute;z-index:40;inset-inline:0;top:calc(100% + 4px);
  max-height:min(340px,52vh);overflow-y:auto;background:var(--panel);
  border:1.5px solid var(--ink);border-radius:2px;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.35);
}
.menu[hidden]{display:none}
.opt{padding:9px 12px;cursor:pointer;font-size:15px;
  border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.opt:last-child{border-bottom:0}
.opt[aria-selected="true"],.opt:hover{background:var(--sel)}
.opt .c{margin-inline-start:auto;font-family:var(--mono);font-size:11.5px;
  color:var(--muted)}
.opt mark{background:none;color:inherit;font-weight:700;
  text-decoration:underline;text-underline-offset:2px}
.opt.none{color:var(--muted);cursor:default;font-size:14px}
.clear button{font-family:var(--sans);font-size:14px;padding:12px 16px;
  border:1.5px solid var(--line);background:var(--panel);border-radius:2px;
  cursor:pointer;color:var(--muted);white-space:nowrap}
.clear button:hover{border-color:var(--ink);color:var(--ink)}
.miss-line{margin:14px 0 0;font-size:13.5px;color:var(--muted)}
.miss-line input{font-family:var(--sans);font-size:14px;padding:7px 10px;
  margin-inline-start:8px;border:1px solid var(--line);border-radius:2px;
  background:var(--panel);color:var(--ink);width:min(320px,60vw)}

/* ---------------- verdict ---------------- */
.verdict{margin:26px 0 18px;background:var(--panel);border:1px solid var(--line);
  border-inline-start:4px solid var(--muted);border-radius:3px;padding:16px 18px}
.verdict.ok{border-inline-start-color:var(--canl)}
.verdict.warn{border-inline-start-color:var(--canh)}
.verdict.bad{border-inline-start-color:var(--alert)}
.verdict h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.verdict.ok h2{color:var(--canl)}
.verdict.bad h2{color:var(--alert)}
.verdict .nums{font-family:var(--mono);font-size:13px;color:var(--muted);
  margin-top:7px;display:flex;gap:18px;flex-wrap:wrap}
.verdict .nums b{color:var(--ink);font-size:16px;font-weight:600}
.verdict p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.verdict .live{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
/* The sentence a salesperson can repeat verbatim, set apart from the
   analysis so it can be found without reading any of it. */
.say{margin-top:11px;padding:9px 12px;background:var(--soft);
  border:1px dashed var(--line);border-radius:2px;font-size:14.5px}
.csn{display:block;margin-top:5px;font-family:var(--mono);
  font-size:10.5px;font-style:normal;color:var(--muted)}
.lg{display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;flex:none;vertical-align:middle}
.lg img{width:100%;height:100%;object-fit:contain}
.lg .mono{display:none;width:100%;height:100%;border-radius:50%;
  align-items:center;justify-content:center;font-family:var(--sans);
  font-weight:800;font-size:60%;color:#fff;
  background:hsl(var(--h) 42% 38%)}
.lg.nolo img{display:none}
.lg.nolo .mono{display:flex}
.lg.big{width:46px;height:46px}
/* The badge sits in the corner OPPOSITE the text, so the two swap sides
   together when the language flips direction and can never collide. */
.lg.card-lg{position:absolute;top:12px;inset-inline-end:14px;
  width:30px;height:30px}
.lg svg{width:100%;height:100%}
.card .cn,.card .cm{padding-inline-end:40px}
.opt .lg{width:20px;height:20px;margin-inline-end:8px}
.crow{padding:9px 12px;border:1px solid var(--line);border-radius:2px;
  background:var(--panel);margin-bottom:6px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.crow .cn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.crow i{flex-basis:100%;font-family:var(--mono);font-size:10.5px;
  font-style:normal;color:var(--muted)}
.shots{margin:0 0 14px}
.shhead{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.shhead b{font-size:14px}
.shn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.shadd{margin-inline-start:auto;font-family:var(--mono);font-size:12.5px;
  color:var(--canl);border:1px dashed var(--canl);border-radius:2px;
  padding:4px 10px;cursor:pointer}
.shadd:hover{background:var(--chip)}
.shgrid{display:grid;gap:8px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.shot{margin:0;border:1px solid var(--line);border-radius:2px;
  background:var(--panel);overflow:hidden}
/* The year you asked for is marked, not filtered: a fitting from another
   year is usually the same wiring, and hiding it loses more than it saves. */
.shot[data-hit="1"]{border-color:var(--canl)}
.shot img{display:block;width:100%;height:112px;object-fit:cover;cursor:zoom-in}
.shot figcaption{display:flex;align-items:center;gap:6px;padding:5px 7px;
  font-size:11.5px;color:var(--muted)}
.shy{font-family:var(--mono);color:var(--ink)}
.shdel{margin-inline-start:auto;background:none;border:0;cursor:pointer;
  color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.shdel:hover{color:var(--alert)}
.shots .empty{font-size:13px;color:var(--muted);padding:10px 0}
.shwarn:not(:empty){font-size:12.5px;color:var(--alert);margin-bottom:6px}
.shnote{flex:1;min-width:0;border:0;background:none;color:var(--ink);
  font-family:var(--sans);font-size:11.5px;padding:2px 0}
.shnote::placeholder{color:var(--muted)}
.shnote:focus{outline:0;border-bottom:1px solid var(--canl)}
.shdel[data-armed="1"]{color:var(--alert);font-size:11px}
.shsign{display:block;margin-top:8px;font-family:var(--mono);font-size:13px;
  color:var(--canl);background:none;border:1px solid var(--canl);
  border-radius:2px;padding:7px 14px;cursor:pointer}
.shsign:hover{background:var(--chip)}
.shsign:disabled{opacity:.6;cursor:default}
/* Full size opens over the page: a new tab cannot be handed a data URL. */
.shview{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.86);
  display:flex;align-items:center;justify-content:center;padding:16px;
  cursor:zoom-out}
.shview[hidden]{display:none}
.shview img{max-width:100%;max-height:100%;object-fit:contain}
.pickhead{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.pickhead .pname{font-size:21px;font-weight:800;letter-spacing:.01em}
.pickhead .pyr{font-family:var(--mono);color:var(--muted);font-size:14px}
.see{font-size:12.5px;font-family:var(--mono);color:var(--canl);
  text-decoration:none;border-bottom:1px dotted var(--canl)}
.see:hover{border-bottom-style:solid}
.card{position:relative}
.dtog{font-family:var(--mono);font-size:11px;color:var(--muted);
  background:none;border:none;border-bottom:1px dotted var(--line);
  padding:0 0 2px;cursor:pointer;margin-bottom:8px}
.dtog:hover{color:var(--ink)}
.decl .why{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.say span{display:block;font-family:var(--mono);font-size:10.5px;
  color:var(--muted);letter-spacing:.05em;margin-bottom:3px}
.shr{margin-top:10px;font-family:var(--sans);font-size:14px;font-weight:600;
  padding:9px 16px;border:1.5px solid var(--canl);background:none;
  color:var(--canl);border-radius:2px;cursor:pointer}
.shr:hover{background:var(--canl);color:var(--panel)}

/* ---------------- the list ---------------- */
h3.sec{font-size:14px;font-weight:600;margin:24px 0 8px;color:var(--muted)}
h3.sec b{color:var(--ink)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  overflow:hidden}
.li{display:grid;grid-template-columns:44px 1fr auto auto auto auto;
  gap:0 16px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--soft)}
.li .pair{justify-self:center}
.li .nm{min-width:0}
.li .nm .t{font-weight:600;font-size:15px;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Latin names inside an Arabic page get torn apart by the bidi algorithm
   -- SPORTAGE renders as "TAGE SPOR" once a highlight splits it into two
   runs. Isolating every field that can hold a Latin name fixes it at the
   source, and bdi carries the direction for the ones built from pieces. */
.t,.d,.ev,.why,.num,.opt,.row span,.s,.dev{unicode-bidi:isolate}
bdi{unicode-bidi:isolate}
.li .nm .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:1px}
.lvl{font-family:var(--mono);font-size:11.5px;margin-top:2px}
.lvl.ok{color:var(--canl)}
.lvl.no{color:var(--alert)}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);
  text-align:center;min-width:58px}
.num b{display:block;font-size:15.5px;color:var(--ink);font-weight:600;line-height:1.3}
.num.zero b{color:var(--muted);font-weight:400}
.li .sx{background:none;border:1px solid var(--line);border-radius:2px;
  font-family:var(--sans);font-size:12.5px;color:var(--muted);cursor:pointer;
  padding:4px 10px;white-space:nowrap}
.li .sx:hover{border-color:var(--ink);color:var(--ink)}
.sensors{grid-column:1/-1;padding:12px 2px 4px}
.sensors .chips{display:flex;gap:6px;flex-wrap:wrap}
.dh{font-family:var(--mono);font-size:11px;color:var(--muted);
  letter-spacing:.04em;margin:0 0 6px}
.dev + .dev,.dh + .dev{margin-top:10px}
.dev{border:1px solid var(--line);border-radius:2px;padding:9px 11px;
  background:var(--soft)}
.dev + .dh,.chips + .dh{margin-top:14px}
.dhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.dhead .imei{font-family:var(--mono);font-size:13px;font-weight:600;
  letter-spacing:.02em}
.dhead .unit{font-size:12.5px;color:var(--muted)}
.dhead .when{margin-inline-start:auto;font-family:var(--mono);font-size:11.5px;
  color:var(--muted)}
.dev .s b{font-family:var(--mono);font-weight:600;margin-inline-start:4px}
/* Configured but silent: present enough to read, quiet enough that the
   working ones are what the eye lands on. */
.s.quiet{background:transparent;color:var(--muted);border-color:var(--line)}
.s.quiet b{font-weight:400;opacity:.8}
.dcount{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}
.dwho{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);
  margin:-3px 0 7px}
.dwho b{color:var(--ink);font-weight:600}
.s{font-size:12.5px;padding:3px 9px;border-radius:2px;background:var(--chip);
  color:var(--chipT);border:1px solid var(--chipL)}
.s.no{background:var(--chipN);color:var(--chipNT);border-color:var(--chipNL)}
/* Control is not a reading. Same row, because that is where a customer
   looks for what the car can do, but its own colour and its own word so
   the two are never taken for one another. */
.s.cap{background:transparent;color:var(--canh);border-color:var(--canh);
  font-weight:600}
@media(max-width:640px){
  .li{grid-template-columns:36px 1fr auto auto}
  .li .num:nth-child(5),.li .num:nth-child(6){display:none}
}
.cfg .nm .t{font-family:var(--mono);font-weight:500;font-size:13px;
  white-space:normal;word-break:break-all}
.empty{padding:16px;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0;max-width:70ch}

/* ---------------- the guide ---------------- */
#guide{position:fixed;inset:0;z-index:80;background:rgba(10,14,16,.5);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;
  backdrop-filter:blur(2px)}
#guide[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.shead{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line)}
.shead span{font-weight:700;font-size:16px;margin-inline-end:auto}
.sbody{overflow-y:auto;padding:8px 22px 26px}
.sbody h2{font-size:23px;letter-spacing:-.02em;margin:16px 0 6px}
.sbody h3{font-size:15px;margin:24px 0 6px;color:var(--canl);
  border-bottom:1px solid var(--line);padding-bottom:5px}
.sbody .gi{color:var(--muted);font-size:14.5px;margin:0}
.sbody ul{margin:0;padding-inline-start:20px}
.sbody li{margin-bottom:7px;font-size:14.5px}
.sbody .ver{font-family:var(--mono);font-size:13px;color:var(--muted);
  font-weight:600;letter-spacing:0}
.rel{border-inline-start:2px solid var(--line);padding-inline-start:12px;
  margin-bottom:14px}
.rel.new{border-inline-start-color:var(--canh)}
.relh{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.relh b{font-family:var(--mono);font-size:14px}
.rel.new .relh b{color:var(--canh)}
.relh span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){
  .sheet{animation:rise .18s ease-out both}
}

/* ---------------- cards ---------------- */
#cards{margin-top:30px}
.cards{display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{
  display:grid;gap:1px;text-align:start;cursor:pointer;font-family:var(--sans);
  background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:12px 14px;color:var(--ink);position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;
  width:3px;background:var(--canh)}
.card:hover{border-color:var(--ink)}
.card:hover::before{background:var(--canl)}
/* The chosen card stays marked while its answer is on screen, so it is
   never a mystery which of the ten produced what is below. */
.card.on{border-color:var(--ink);background:var(--soft)}
.card.on::before{background:var(--canl);width:4px}
.back{background:none;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);cursor:pointer;font-family:var(--sans);font-size:13px;
  padding:6px 12px;margin:22px 0 -6px}
.back:hover{border-color:var(--ink);color:var(--ink)}
.card .cn{font-weight:700;font-size:15px;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cm{font-size:13.5px;color:var(--muted);min-height:1.2em;

function fold(s){
  return (s||"").toString().toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/[ىئ]/g,"ي")
    .replace(/ؤ/g,"و").replace(/ء/g,"").replace(/[^\w\u0600-\u06FF]+/g," ").trim();
}
/* The catalogue is written in Latin letters and half the people asking
   type Arabic, so a query the alias table can translate is answered by
   the translation: "كيا" finds KIA. Partial spelling counts too --
   nobody finishes typing a word before they look up at the list.
   Returns the text to highlight, "" for an empty query, null for no
   match, so the caller filters and highlights from one decision. */
function qhit(label, raw){
  const q = fold(raw), L = fold(label);
  if(!q) return "";
  if(L.includes(q)) return q;
  if(!/[\u0600-\u06FF]/.test(q)) return null;
  for(const w of terms(raw))
    if(!/[\u0600-\u06FF]/.test(w) && L.includes(w)) return w;
  for(const [a, l] of Object.entries(ALIAS))
    if(fold(a).includes(q) && L.includes(l)) return l;
  return null;
}

function terms(s){
  let t = " "+fold(s)+" ";
  for(const [a,l] of Object.entries(ALIAS)) t = t.split(a).join(" "+l+" ");
  return t.split(/\s+/).filter(w => w.length > 1);
}

/* ============================================== photos of the fitting

   The catalogue answers "is it supported". The person holding the wire
   asks the next question -- where does it go -- and the only honest
   answer to that is a picture of the last time somebody did it.

   Kept per make + model + year, because that is exactly how the same
   person will look for it the second time.

   The store is the browser's own, so this works with nothing set up at
   all. Everything above it goes through `SHOTS`, so putting the photos
   somewhere the whole team can reach is a change to this object and to
   nothing else. */
const LOCAL = (() => {
  const NAME = "canval-shots", STORE = "shots";
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(NAME, 1);
    r.onupgradeneeded = () => {
      const s = r.result.createObjectStore(STORE, {keyPath: "id"});
      s.createIndex("car", "car");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const req = r => new Promise((res, rej) => {
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const shop = async mode =>
    (await open()).transaction(STORE, mode).objectStore(STORE);
  return {
    /* No store, no promises: the section says so instead of failing. */
    ready: () => typeof indexedDB !== "undefined",
    shared: false,
    needsAuth: () => false,
    signIn: async () => {},
    resume: async () => null,
    async list(car){
      if(!this.ready()) return [];
      const all = await req((await shop("readonly")).index("car").getAll(car));
      return (all || []).sort((a, b) => b.at - a.at);
    },
    async save(rec){ await req((await shop("readwrite")).put(rec)); return rec; },
    async setNote(rec){ return this.save(rec); },
    async del(id){ await req((await shop("readwrite")).delete(id)); },
  };
})();

         no prompt, and while the grant stands the answer arrives with
         nothing on screen.
       - the account is remembered and passed back as a hint, so if the
         silent path is ever blocked -- Safari and private windows shut
         out the third-party cookies it leans on -- what appears is one
         tap on a named account rather than a chooser and a consent
         screen.

     The token reaches only files this page created, which is what makes
     keeping it on the device a fair trade for not asking a salesperson
     to sign in between two lookups. */
  const KEY = "canval.drive.tok";
  const WHO = "canval.drive.who";
  const cached = () => {
    try{
      const c = JSON.parse(localStorage.getItem(KEY) || "null");
      // A minute of margin, so a token cannot expire mid-upload.
      if(c && c.t && c.exp > Date.now() + 60000) return (token = c.t);
    }catch(e){ /* storage blocked -- carry on without it */ }
    return null;
  };
  const keep = (t, secs) => {
    token = t;
    try{
      localStorage.setItem(KEY, JSON.stringify(
        {t, exp: Date.now() + (secs > 0 ? secs : 3600) * 1000}));
    }catch(e){ /* nothing to do; the tab still holds it in memory */ }
    return t;
  };
  const forget = () => {
    token = null;
    try{ localStorage.removeItem(KEY); }catch(e){}
  };
  const who = () => { try{ return localStorage.getItem(WHO) || ""; }
                      catch(e){ return ""; } };
  // Drive answers this with the drive.file scope alone, so remembering
  // the account costs no extra permission.
  const remember = async () => {
    try{
      const a = await call("/about?fields=user(emailAddress)");
      const m = a && a.user && a.user.emailAddress;
      if(m) localStorage.setItem(WHO, m);
    }catch(e){ /* a hint is a convenience, never a requirement */ }
  };

  const ask = (prompt) => gis().then(() => new Promise((res, rej) => {
    client = client || google.accounts.oauth2.initTokenClient(
      {client_id: GOOGLE_CLIENT_ID, scope: SCOPE, prompt: "",
       callback: () => {}});
    client.callback = r => r.access_token
      ? res(keep(r.access_token, +r.expires_in))
      : rej(new Error(r.error || "sign-in refused"));
    // Fires when the popup is blocked or a silent attempt cannot be made
    // at all. Without it the promise never settles and the button sticks
    // on "signing in" forever.
    client.error_callback = e => rej(new Error((e && e.type) || "blocked"));
    const req = {prompt};
    // Naming the account is what turns a re-appearance of this dialog
    // from "which of your five accounts" into a single tap.
    if(who()) req.hint = who();
    client.requestAccessToken(req);
  }));

  const gis = () => new Promise((res, rej) => {
    if(window.google && window.google.accounts) return res();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = res;
    s.onerror = () => rej(new Error("google sign-in did not load"));
    document.head.appendChild(s);
  });

  const call = async (path, opts = {}) => {
    const r = await fetch(path.startsWith("http") ? path : API + path, {
      ...opts, headers: {Authorization: `Bearer ${token}`, ...(opts.headers || {})}});
    if(r.status === 401){ forget(); throw new Error("signed out"); }
    if(!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
    return r.status === 204 ? null : r.json();
  };

  // Found or made, once per session. With drive.file this search only
  // ever sees folders this page made, so it cannot wander into the rest
  // of somebody's Drive.
  const folderId = async () => {
    if(folder) return folder;
    const q = encodeURIComponent(`name='${SHOT_FOLDER}' and trashed=false and `
      + `mimeType='application/vnd.google-apps.folder'`);
    const found = await call(`/files?q=${q}&fields=files(id)&pageSize=1`);
    if(found.files && found.files.length) return folder = found.files[0].id;
    const made = await call("/files", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: SHOT_FOLDER,
                            mimeType: "application/vnd.google-apps.folder"})});
    return folder = made.id;
  };

  return {
    ready: () => !!GOOGLE_CLIENT_ID,
    shared: true,
    needsAuth: () => !token && !cached(),
    /* The quiet door, tried once when the page loads: with the grant
       still in place Google answers with nothing on screen. Failure
       here is not an error -- it only means the button has to show. */
    async resume(){
      if(cached()) return token;
      if(resumed) return null;
      resumed = true;
      try{ return await ask(""); }catch(e){ return null; }
    },
    /* The loud door, behind the button, reached only when the quiet one
       came back empty. */
    async signIn(){
      const t = await ask("consent");
      await remember();
      return t;
    },
    async list(car){
      if(!token) return [];
      const fid = await folderId();
      const q = encodeURIComponent(`'${fid}' in parents and trashed=false and `
        + `appProperties has {key='car' and value='${car}'}`);
      const r = await call(`/files?q=${q}&pageSize=100&orderBy=createdTime desc`
        + `&fields=files(id,description,createdTime,appProperties)`);
      return (r.files || []).map(f => ({
        id: f.id, car,
        yr: +((f.appProperties || {}).yr) || null,
        note: f.description || "",
        at: Date.parse(f.createdTime) || 0,
        // The thumbnail service serves a link-shared file to anyone,
        // which is exactly what a colleague opening this page is.
        src: `https://drive.google.com/thumbnail?id=${f.id}&sz=w1000`,
      }));
    },
    async save(rec){
      const blob = await (await fetch(rec.src)).blob();
      const name = `${rec.car.replace(/\|/g, "__")}__${rec.yr || "any"}`
        + `__${rec.at}.jpg`;
      const meta = {name, parents: [await folderId()], description: rec.note || "",
        appProperties: {car: rec.car, mk: rec.mk || "", md: rec.md || "",
                        yr: String(rec.yr || "")}};
      const b = "canval" + Math.random().toString(36).slice(2);
      const body = new Blob([
        `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,
        JSON.stringify(meta),
        `\r\n--${b}\r\nContent-Type: image/jpeg\r\n\r\n`, blob,
        `\r\n--${b}--`]);
      const made = await call(`${UP}?uploadType=multipart&fields=id`,
        {method: "POST", headers: {"Content-Type": `multipart/related; boundary=${b}`},
         body});
      // Without this the link only opens for whoever uploaded it.
      await call(`/files/${made.id}/permissions`, {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({role: "reader", type: "anyone"})});
      return {...rec, id: made.id,
              src: `https://drive.google.com/thumbnail?id=${made.id}&sz=w1000`};
    },
    async setNote(rec){
      await call(`/files/${rec.id}`, {method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({description: rec.note || ""})});
      return rec;
    },
    async del(id){ await call(`/files/${id}`, {method: "DELETE"}); },
  };
})();

/* Drive when it is configured, the browser's own shelf otherwise -- so
   the page still works opened from a file, with no account at all. */
const SHOTS = DRIVE.ready() ? DRIVE : LOCAL;

/* One car, one key -- folded, so "KIA"/"kia " land in the same place. */
const shotCar = (mk, md) => fold(mk) + "|" + fold(md);

/* Phone photos run 3-8 MB and a workshop's signal does not. Shrinking
   before the upload is what makes this usable there -- and it is the
   difference between a free tier holding 700 photos and 15,000. */
function shrink(file, max = 1600, q = 0.82){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({src: c.toDataURL("image/jpeg", q), w: c.width, h: c.height});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("not an image")); };
    img.src = url;
  });
}

/* ================================================== the dropdown itself */
function combo(id, opts){
  const input = $(id), menu = $("m-"+id), wrap = $("c-"+id);
  let items = [], active = -1, open = false;

  const draw = () => {
    const raw = input.value, q = fold(raw);
    const shown = (q ? items.filter(i => qhit(i.label, raw) !== null)
                     : items).slice(0,300);
    if(!shown.length){
      menu.innerHTML = `<div class="opt none">${esc(T("noMatch"))}</div>`;
    }else{
      menu.innerHTML = shown.map((i,n) => {
        let label = esc(i.label);
        if(q){
          // Highlight what actually matched -- for an Arabic query that
          // is the word it translated to, which is what the eye is
          // looking for in a Latin list.
          const hit = qhit(i.label, raw) || "";
          const at = hit ? fold(i.label).indexOf(hit) : -1;
          if(at >= 0) label = esc(i.label.slice(0,at)) + "<mark>" +
            esc(i.label.slice(at,at+hit.length)) + "</mark>" + esc(i.label.slice(at+hit.length));
        }
        return `<div class="opt" role="option" data-v="${esc(i.value)}"
          aria-selected="${n === active}">${i.logo ? logoHtml(i.value) : ""}<bdi dir="${
          /[\u0600-\u06FF]/.test(i.label) ? "rtl" : "ltr"}">${label}</bdi>${
          i.count ? `<span class="c">${i.count}</span>` : ""}</div>`;
      }).join("");
    }
    menu.querySelectorAll(".opt")[active]?.scrollIntoView({block:"nearest"});
  };
  const show = () => {
    items = opts.items(); active = -1; open = true;
    menu.hidden = false; input.setAttribute("aria-expanded","true"); draw();
  };
  const hide = () => {
    open = false; menu.hidden = true; input.setAttribute("aria-expanded","false");
  };
  const choose = v => {
    const hit = items.find(i => i.value === v);
    if(!hit) return;
    input.value = hit.label; hide(); opts.pick(hit.value);
  };

  input.addEventListener("focus", show);
  input.addEventListener("input", () => { open ? draw() : show(); });
  input.addEventListener("keydown", e => {
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      if(!open) return show();
      const n = menu.querySelectorAll(".opt[data-v]").length;
      if(!n) return;
      active = e.key === "ArrowDown" ? (active+1) % n : (active-1+n) % n;
      draw();
    }else if(e.key === "Enter"){
      const el = menu.querySelectorAll(".opt[data-v]")[active < 0 ? 0 : active];
      if(el){ e.preventDefault(); choose(el.dataset.v); }
    }else if(e.key === "Escape"){ hide(); }
  });
  menu.addEventListener("mousedown", e => {
    const el = e.target.closest(".opt[data-v]");
    if(el){ e.preventDefault(); choose(el.dataset.v); }
  });
  document.addEventListener("mousedown", e => {
    if(open && !wrap.contains(e.target)) hide();
  });
  return {clear(){ input.value = ""; hide(); }};
}

/* ------------------------------------------------------------- load */
async function load(){
  /* An empty page and a loading page are different promises. On a slow
     connection the difference is whether somebody waits or gives up. */
  $("out").innerHTML = `<div class="verdict"><h2>${T("loading")}</h2></div>`;
  try{
    const [v,cfg,fleet,meta,cross] = await Promise.all(
      ["vehicles","configs","fleet","meta","crossfits"].map(n =>
        fetch("data/"+n+".json").then(r => {
          // Crossfits arrived after the others; an older data folder
          // simply has none, which is not a reason to fail the page.
          if(!r.ok) return n === "crossfits" ? [] : Promise.reject(new Error(n));
          return r.json(); }).catch(e => {
            if(n === "crossfits") return []; throw e; })));
    Object.assign(state,{v,cfg,fleet,meta,cross: cross || []});
    for(const x of state.cfg) x._h = fold(x.nm);
    for(const x of state.cross) x._h = fold(x.nm);
    $("out").innerHTML = "";
    buildMakes(); paint();
  }catch(e){
    $("out").innerHTML = `<div class="verdict bad"><h2>${T("dataMiss")}</h2>
      <p>${T("dataMissP",{f:esc(e.message)})}</p></div>`;
  }
}
function buildMakes(){
  const m = new Map();
  for(const v of state.v){
    if(v.g || !v.mk) continue;   // generic protocols are a path of their
    m.set(v.mk, (m.get(v.mk)||0) + (v.f ? 1 : 0));   // own, not a make
  }
  state.makes = [...m.keys()].sort()
    .map(k => ({value:k, label:k, count:m.get(k) || "", logo:true}));
}
function modelsOf(mk){
  const m = new Map();
  for(const v of state.v){
    if(v.g || v.mk !== mk) continue;
    const k = v.md || v.n;
    m.set(k, (m.get(k)||0) + v.f);
  }
  return [...m.keys()].sort().map(k => ({value:k, label:k, count:m.get(k) || ""}));
}
/* Devices fitted on somebody else's file, found by the name a human
   typed on them. The catalogue says the file is a NISSAN X-TRAIL; the
   configuration says the car is an Outlander; the device says it works.
   The device wins -- that is this tool's whole rule. */
function crossFor(mk, md){
  const want = terms(md + " " + mk).filter(w => w.length > 2);
  if(!want.length || !state.cross) return [];
  const model = terms(md).filter(w => w.length > 2);
  if(!model.length) return [];
  const hit = state.cross.filter(c =>
    model.every(w => c._h.includes(w)));
  const byFile = new Map();
  for(const c of hit){
    const at = byFile.get(c.i) || {i: c.i, fl: c.fl, n: 0, a: 0, names: []};
    at.n += c.n; at.a += (c.a || 0);
    if(at.names.length < 3) at.names.push(c.nm);
    byFile.set(c.i, at);
  }
  return [...byFile.values()].sort((x, y) => y.n - x.n);
}

function filesFor(mk, md){
  return state.v.filter(v => !v.g && v.mk === mk && (v.md || v.n) === md);
}
function yearsOf(files){
  const y = new Set();
  for(const f of files){
    if(!f.y0) continue;
    for(let i = f.y0; i <= (f.y1 || THIS_YEAR); i++) y.add(i);
  }
  return [{value:"", label:T("allYears")}]
    .concat([...y].sort((a,b) => b-a).map(v => ({value:String(v), label:String(v)})));
}
const coverYear = (f,y) => !y || !f.y0 || (y >= f.y0 && y <= (f.y1 || THIS_YEAR));

/* A make's face. 96 of them are the real logos, vendored into the repo
   so nothing depends on anyone else's server. The rest -- the brand-new
   Chinese marques, the farm equipment, the oddballs -- get a monogram in
   a colour hashed from the name, so every make has SOME face, today and
   for any make that appears next month. The swap happens through the
   image's own error event: no list to maintain. */
const logoSlug = mk => (mk || "").toLowerCase()
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const hueOf = s => { let h = 0;
  for(const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function logoHtml(mk, cls){
  if(!mk) return "";
  const mono = `<span class="mono" style="--h:${hueOf(mk)}">${
    esc(mk.trim().slice(0,1).toUpperCase())}</span>`;
  return `<span class="lg${cls ? " " + cls : ""}"><img src="logos/${
    logoSlug(mk)}.png" alt="" loading="lazy"
    onerror="this.parentNode.classList.add('nolo')">${mono}</span>`;
}
/* Whether this export carries activity data at all. When the sweep runs
   without it, every file reads zero -- and a page that prints "0 active"
   over a fleet it just proved is sending would be calling healthy
   devices dead. Unknown gets a dash, and no verdict leans on it. */
const actKnown = () => state.v.some(f => (f.a || 0) > 0);

/* -------------------------------------------------------- rendering */
function pairSvg(bus){
  const dash = bus === 2 ? 'stroke-dasharray="4 3"' : "";
  return `<svg class="pair" width="32" height="13" viewBox="0 0 34 14"
    aria-hidden="true" fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M1 4c4 0 4 6 8 6s4-6 8-6 4 6 8 6 4-6 8-6" stroke="var(--canh)" ${dash}/>
    <path d="M1 10c4 0 4-6 8-6s4 6 8 6 4-6 8-6 4 6 8 6" stroke="var(--canl)" ${dash}/>
  </svg>`;
}
/* Arabic counts a thing, two things, a few things and many things with
   four different words, and "من 2 ساعة" is what you get for ignoring that.
   Three lines of it here is cheaper than a stilted phrase on every row. */
const AR_UNITS = {
  m: ["دقيقة", "دقيقتين", "دقايق", "دقيقة"],
  h: ["ساعة", "ساعتين", "ساعات", "ساعة"],
  d: ["يوم", "يومين", "أيام", "يوم"],
};
function since(ts){
  if(!ts) return "—";
  const s = Math.max(0, Math.floor(Date.now()/1000) - ts);
  if(s < 90) return T("now");
  const [u, n] = s < 5400 ? ["m", Math.round(s/60)]
    : s < 172800 ? ["h", Math.round(s/3600)]
    : ["d", Math.round(s/86400)];
  if(state.lang !== "ar") return `${n}${u} ago`;
  const w = AR_UNITS[u];
  if(n === 1) return "من " + w[0];
  if(n === 2) return "من " + w[1];
  return "من " + n + " " + (n <= 10 ? w[2] : w[3]);
}

const num = (n,label) =>
  `<div class="num ${n ? "" : "zero"}"><b>${n ?? 0}</b>${label}</div>`;

function fileRow(f){
  const bits = [
    f.b ? "CAN"+f.b : "CAN?",
    f.y0 ? (f.y1 ? `${f.y0}\u2013${f.y1}` : `${f.y0}+`) : T("allYears"),
    f.kb ? f.kb+"kbps" : null,
    f.p ? "OBD "+f.p : null,
    f.r > 1 ? "rev "+f.r : null,

  let live = "";

  else if(f.lv && f.lv.k)
    live = `<div class="lvl no">${T("proNo",{k:f.lv.k})}</div>`;
  return `<div class="li">
    ${pairSvg(f.b)}
    <div class="nm"><div class="t">${bdi(f.n)}</div>

    ${num(f.f, T("devices"))}
    ${num(actKnown() ? (f.a || 0) : "\u2014", T("nActive"))}
    ${num(f.c, T("nConfigs"))}
    <button class="sx" data-sx="${f.i}">${(f.s||[]).length} ${T("nSig")}</button>
  </div>`;
}
function cfgRow(c){
  return `<div class="li cfg"><div></div>
    <div class="nm"><div class="t">${bdi(c.nm)}</div>
      <div class="d">${T("onFile")} ${bdi(c.fl)}</div></div>
    ${num(c.n, T("devices"))}${num(c.a, T("nActive"))}<div></div><div></div>
  </div>`;
}

/* The ladder, in the order the question is really settled:
   1. the platform saw signals                -> supported, proven
   2. installed and reporting, sensors unchecked
   3. installed, and the platform saw nothing  -> a real negative
   4. catalogued, never installed
   Live evidence beats install counts: a file on twenty parked trucks
   proves less than one truck actually sending fuel level. */
function liveOf(files){
  const s = new Set(); let asked=0, saw=0, reporting=0;
  for(const f of files){
    if(!f.lv) continue;
    asked += f.lv.n||0; saw += f.lv.k||0; reporting += f.lv.r||0;
    (f.lv.s||[]).forEach(x => s.add(x));
  }
  return {asked, saw, reporting, signals:[...s]};
}
function verdict(files, year){
  const inYear = files.filter(f => coverYear(f, year));
  const fitted = inYear.reduce((s,f) => s+f.f, 0);
  const active = inYear.reduce((s,f) => s+(f.a||0), 0);
  const cfgs   = inYear.reduce((s,f) => s+(f.c||0), 0);
  const lv     = liveOf(inYear);
  /* Car sharing rests on a field fact: devices of this model running a
     lock/unlock script. Max across files, not sum -- a dual-bus car
     carries two files of the same model and must stay one car. The
     fitted total above does sum, but that habit predates this claim,
     and a promise made to a customer gets the conservative number. */
  const csN = inYear.length
    ? Math.max(0, ...inYear.map(f => (f.sc && f.sc.n) || 0)) : 0;
  const cs  = csN ? {n: csN,
    s: [...new Set(inYear.flatMap(f => (f.sc && f.sc.s) || []))].slice(0,4)}
    : null;

  if(year && !inYear.length){
    const r = [...new Set(files.map(f => f.y0
      ? (f.y1 ? `${f.y0}\u2013${f.y1}` : `${f.y0}+`) : T("allYears")))].join("\u060c ");
    return {cls:"bad", h:T("vYear",{y:year}), nums:null,
            p:T("vYearP",{r}), inYear:files, lv};
  }
  if(lv.reporting)
    return {cls:"ok", h:T("vOk"), inYear, lv, cs, p:null,
      say:T("sayOk", {s: lv.signals.slice(0,3).join(state.lang === "ar" ? "\u060c " : ", ")}),
      nums:[[fitted,T("nFitted")],[`${lv.reporting} / ${lv.saw}`,T("nSampled")],
            [lv.signals.length,T("nSignals")]]};
  if(fitted && lv.saw)
    return {cls:"bad", h:T("vDead"), inYear, lv, cs, p:T("vDeadP"), say:T("sayDead"),
      nums:[[fitted,T("nFitted")],[lv.saw,T("nChecked")],[cfgs,T("nConfigs")]]};
  if(fitted && (active || !actKnown()))
    return {cls:"warn", h:T("vPend"), inYear, lv, cs, p:T("vPendP"), say:T("sayPend"),
      nums:[[fitted,T("nFitted")],[active,T("nActive")],[cfgs,T("nConfigs")]]};
  if(fitted)
    return {cls:"warn", h:T("vQuiet"), inYear, lv, cs, p:T("vQuietP"), say:T("sayQuiet"),
      nums:[[fitted,T("nFitted")],[cfgs,T("nConfigs")]]};
  return {cls:"bad", h:T("vNever"), nums:null, p:T("vNeverP"), say:T("sayNever"),
          inYear, lv};
}

/* A file with no end year covers every year after its start, so asking
   for 2022 legitimately matches both "SUBURBAN [13+]" and "[22+]".
   Legitimate but misleading: one was built for the year asked about and
   the other merely reaches it. Splitting them keeps both -- the older
   file is still the fallback when the closer one fails -- while making it
   obvious which is which. */
function splitByFit(files, year){
  if(!year) return [files, []];
  const dated = files.filter(f => f.y0);
  if(!dated.length) return [files, []];
  const newest = Math.max(...dated.map(f => f.y0));
  const best = files.filter(f => !f.y0 || f.y0 === newest);
  const wider = files.filter(f => f.y0 && f.y0 !== newest);
  return wider.length ? [best, wider] : [files, []];
}

function renderPick(){
  const {mk, md, yr} = state.pick || {};
  if(!mk || !md){ if(!state.free) $("out").innerHTML = ""; return; }
  const files = filesFor(mk, md);
  const v = verdict(files, yr ? +yr : null);
  // Nothing of its own, but somebody is running it on another file: the
  // honest answer is yes-with-a-file, not the "never installed" this
  // used to print over twenty-five working installations.
  const cross = crossFor(mk, md);
  if(cross.length && !v.inYear.some(f => f.f)){
    /* Every fact on this page hangs off a file: the readings, the lock
       scripts, whether anything is reporting at all. A car fitted on
       another car's file has no file of its own, so each of those came
       back empty and the page went quiet about a car with twenty-one
       working installations behind it.

       Patching them one at a time is how the lock box got fixed while
       the signal chips stayed hidden, and the chips got fixed while the
       colour stayed wrong. So the borrowed files are put through the
       same verdict the vehicle's own files would have been, and only
       the wording is changed afterwards to say whose name is on them.
       Anything added to verdict() from here on is inherited without
       anyone having to remember this case.

       No year is passed. The vehicle's own year is what the customer
       asked about, but these devices are fitted and running today --
       that is the evidence, whatever range the file happens to declare. */
    const top = cross[0], total = cross.reduce((s, c) => s + c.n, 0);
    const borrowed = [...new Set(cross.map(c => c.i))]
      .map(i => state.v.find(x => x.i === i)).filter(Boolean);
    const bv = borrowed.length ? verdict(borrowed, null) : null;

    v.h = T("vCross");
    v.p = T("vCrossP", {f: top.fl});
    v.say = T("sayCross", {n: total, f: top.fl});
    v.nums = [[total, T("nFitted")], [top.fl, T("nOnFile")]];
    if(bv){
      /* The colour is the borrowed file's, not a flat green. Devices are
         fitted either way, so the answer stays yes -- but a file whose
         every device has gone quiet must not be painted as confidently
         as one that is reporting. */
      v.cls = bv.cls === "bad" && borrowed.some(f => f.f) ? "warn" : bv.cls;
      v.lv = bv.lv;
      // The lock count belongs to the file, across every vehicle on it.
      // Carrying `t` and `f` is what makes the line say so instead of
      // passing the neighbour's number off as this model's own.
      if(bv.cs) v.cs = {...bv.cs, t: borrowed.reduce((n, f) => n + (f.f || 0), 0),
                        f: top.fl};
      if(bv.lv && bv.lv.signals.length)
        v.nums.push([bv.lv.signals.length, T("nSignals")]);
    }
  }

  const seeQ = encodeURIComponent([mk, md, yr].filter(Boolean).join(" "));
  let html = `<button class="back" id="back">&#8629; ${T("back")}</button>
    <div class="pickhead">${logoHtml(mk, "big")}
      <div><div class="pname">${bdi(mk + " " + md)}</div>
        <div class="pyr">${yr ? esc(String(yr)) + " \u00b7 " : ""}<a class="see"
          target="_blank" rel="noopener"
          href="https://www.google.com/search?tbm=isch&q=${seeQ}">${T("seeCar")}</a></div>
      </div></div>${shotsShell()}
    <div class="verdict ${v.cls}"><h2>${esc(v.h)}</h2>`;
  if(v.nums) html += `<div class="nums">${v.nums
    .map(([n,l]) => `<span><b>${n}</b> ${esc(l)}</span>`).join("")}</div>`;
  if(v.p) html += `<p>${esc(v.p)}</p>`;
  if(v.say) html += `<div class="say"><span>${T("say")}</span>${esc(v.say)}</div>`;
  if(v.cs) html += `<div class="say cshare"><span>${T("csT")}</span>${
    esc(v.cs.t ? T("csCross", {n: v.cs.n, t: v.cs.t, f: v.cs.f})
               : T("csLine", {n: v.cs.n}))}<i class="csn">${
    v.cs.s.map(bdi).join(" \u00b7 ")}</i></div>`;
  state.shareText = `canval \u2014 ${mk} ${md}${yr ? " " + yr : ""}\n${v.h}${
    v.say ? "\n" + v.say : ""}${
    v.cs ? "\n" + (v.cs.t ? T("csShareX", {n: v.cs.n, t: v.cs.t, f: v.cs.f})
                           : T("csShare", {n: v.cs.n})) : ""}\n${location.href}`;
  html += `<button class="shr" id="shr">${T("share")}</button>`;
  if(v.lv.signals.length || v.cs)
    html += `<div class="live">${
      (v.cs ? `<span class="s cap">${bdi(T("capLock"))}</span>` : "") +
      v.lv.signals.map(s => `<span class="s">${bdi(s)}</span>`).join("")}</div>
      <p style="margin-top:6px">${esc(T(v.cs ? "liveNoteC" : "liveNote"))}</p>`;
  html += `</div>`;

  const [best, wider] = splitByFit(v.inYear, yr ? +yr : null);
  const ownNone = !v.inYear.some(f => f.f);
  const crossHtml = cross.length ? `<h3 class="sec">${T("crossT")}</h3>
    <div class="list">${cross.map(c => {
      const f = state.v.find(x => x.i === c.i);
      return `<div class="crow">
      <b>${bdi(c.fl)}</b><span class="cn">${c.n} ${esc(T("nFitted"))}</span>
      <i>${c.names.map(bdi).join(" \u00b7 ")}</i></div>` +
      // The file's own card, so the signals button is there to open:
      // IMEIs, what each device is sending, and the lock-script count.
      // Its numbers are the file's whole total across every vehicle on
      // it, which is a different figure from the crossing above -- the
      // line under the card says so rather than leaving two numbers to
      // be read as a contradiction.
      (f ? fileRow(f) + `<div class="note xfnote">${
        esc(T("crossCard", {n: c.n, t: f.f, f: c.fl}))}</div>` : "");
    }).join("")}</div>
    <div class="note">${esc(T("crossNote"))}</div>` : "";
  // The file that carries the work goes first. With nothing fitted on
  // its own files, those rows are all zeros, and printing them above
  // the working file made the page read as a denial of the verdict it
  // had given one screen earlier.
  if(ownNone) html += crossHtml;
  html += `<h3 class="sec">${wider.length ? T("bestFor",{y:yr}) : T("filesFor")}
      <b>${bdi(mk + " " + md)}</b></h3>
    <div class="list">${best.map(fileRow).join("") ||
      `<div class="empty">${T("noFiles")}</div>`}</div>`;
  if(ownNone && cross.length && best.length)
    html += `<div class="note">${esc(T("ownEmpty"))}</div>`;
  if(wider.length)
    html += `<h3 class="sec">${T("widerFor",{y:yr})}</h3>
      <div class="list">${wider.map(fileRow).join("")}</div>
      <div class="note">${esc(T("widerNote",{y:yr}))}</div>`;
  if(!ownNone) html += crossHtml;
  if(ownNone && !cross.length) html += genericBlock(mk+" "+md);
  $("out").innerHTML = html;
  mountShots(mk, md, yr);
  syncCards();
}

/* The strip lives directly under the vehicle name: whoever opened this
   page came for a fitting, and this is the part they came for. */
function shotsShell(){
  return `<div class="shots" id="shots">
    <div class="shhead"><b>${T("shT")}</b>
      <span class="shn" id="shn"></span>
      <label class="shadd">${T("shAdd")}<input id="shin" type="file"
        accept="image/*" multiple hidden></label>
    </div>
    <div class="shwarn" id="shwarn"></div>
    <div class="shgrid" id="shgrid"></div>
    <div class="shview" id="shview" hidden><img id="shviewimg" alt=""></div>
    </div>`;
}

/* The photo says where the wire went; the note says which wire. Kept
   short on purpose -- this is a label, not a report. Its own function so
   the write-through is provable without a real text box. */
async function saveNote(rows, id, text){
  const r = (rows || []).find(x => x.id === id);
  if(!r) return null;
  r.note = String(text || "").trim().slice(0, 120);
  await SHOTS.setNote(r);
  return r;
}

async function mountShots(mk, md, yr){
  const grid = document.getElementById("shgrid");
  if(!grid) return;
  if(!SHOTS.ready()){ grid.innerHTML = `<div class="empty">${T("shNo")}</div>`; return; }
  const car = shotCar(mk, md);

  // Ask Google quietly first. On a refresh this hands back the account
  // already granted and nothing appears on screen at all.
  if(SHOTS.needsAuth() && SHOTS.resume){
    grid.innerHTML = `<div class="empty">${esc(T("shSigning"))}</div>`;
    await SHOTS.resume();
  }

  // Shared storage means an account. Say so plainly and once, with the
  // button right there, instead of an empty box that looks broken.
  if(SHOTS.needsAuth()){
    grid.innerHTML = `<div class="empty">${esc(T("shSignWhy"))}
      <button class="shsign" id="shsign">${T("shSign")}</button></div>`;
    const b = document.getElementById("shsign");
    if(b) b.onclick = async () => {
      b.disabled = true; b.textContent = T("shSigning");
      try { await SHOTS.signIn(); await mountShots(mk, md, yr); }
      catch(e){
        b.disabled = false; b.textContent = T("shSign");
        const say = document.getElementById("shwarn");
        if(say) say.textContent = T("shSignNo");
      }
    };
    return;
  }

  let rows = [];
  const paint = async () => {
    try { rows = await SHOTS.list(car); }
    catch(e){ grid.innerHTML = `<div class="empty">${T("shNo")}</div>`; return; }
    const n = document.getElementById("shn");
    if(n) n.textContent = rows.length ? String(rows.length) : "";
    if(!rows.length){ grid.innerHTML = `<div class="empty">${T("shEmpty")}</div>`; return; }
    // The year asked for comes first, but a fitting from another year is
    // still the same wiring far more often than not -- so it is shown,
    // labelled, rather than hidden and quietly missed.
    if(yr) rows.sort((a, b) => (b.yr == yr) - (a.yr == yr) || b.at - a.at);
    grid.innerHTML = rows.map(r => `<figure class="shot"${
      yr && r.yr == yr ? ' data-hit="1"' : ""}>
      <img src="${r.src}" alt="" loading="lazy">
      <figcaption><span class="shy">${esc(r.yr || T("shAny"))}</span>
        <input class="shnote" data-id="${esc(r.id)}" maxlength="120"
          value="${esc(r.note || "")}" placeholder="${T("shNote")}">
        <button class="shdel" data-id="${esc(r.id)}"
          title="${T("shDel")}">\u00d7</button></figcaption>
    </figure>`).join("");
  };

  grid.onchange = e => {
    const box = e.target.closest(".shnote");
    if(box) saveNote(rows, box.dataset.id, box.value);
  };

  grid.onclick = async e => {
    const del = e.target.closest(".shdel");
    if(del){
      // A fitting photo is somebody's afternoon in a workshop. One tap
      // arms it, the second removes it; anything else disarms.
      if(del.dataset.armed !== "1"){
        grid.querySelectorAll(".shdel[data-armed]").forEach(b => {
          b.dataset.armed = ""; b.textContent = "\u00d7"; });
        del.dataset.armed = "1";
        del.textContent = T("shSure");
        return;
      }
      await SHOTS.del(del.dataset.id); paint(); return;
    }
    const img = e.target.closest(".shot img");
    // Browsers refuse to open a data: URL in a new tab, so it opens here.
    if(img){
      const box = document.getElementById("shview");
      const big = document.getElementById("shviewimg");
      if(box && big){ big.src = img.src; box.hidden = false; }
    }
  };

  const view = document.getElementById("shview");
  if(view) view.onclick = () => { view.hidden = true; };

  const input = document.getElementById("shin");
  if(input) input.onchange = async () => {
    const files = [...(input.files || [])];
    input.value = "";
    let lost = 0;
    for(const f of files){
      try {
        const shot = await shrink(f);
        await SHOTS.save({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          car, mk, md, yr: yr ? +yr : null, note: "", at: Date.now(), ...shot});
      } catch(err){ lost++; }        // one bad file must not lose the rest
    }
    await paint();
    const say = document.getElementById("shwarn");
    if(say) say.textContent = lost ? T("shLost", {n: lost}) : "";
  };
  paint();
}

function genericBlock(query){
  const gens = state.v.filter(v => v.g).sort((a,b) => b.f - a.f);
  const words = terms(query);
  const matched = words.length
    ? state.cfg.filter(c => words.some(w => c._h.includes(w))) : [];
  let html = `<h3 class="sec">${T("genTitle")}</h3>
    <div class="list">${gens.map(fileRow).join("")}</div>
    <div class="note">${esc(T("genNote"))}</div>
    <h3 class="sec">${T("cfgTitle",{q:esc(query)})}</h3>`;
  html += matched.length
    ? `<div class="list">${matched.slice(0,15).map(cfgRow).join("")}</div>
       <div class="note">${esc(T("cfgNote"))}</div>`
    : `<div class="list"><div class="empty">${esc(T("cfgNone"))}</div></div>`;
  return html;
}
function renderFree(){
  const q = $("free").value.trim();
  state.free = q;
  if(!q){ $("out").innerHTML = ""; syncCards(); return; }
  state.pick = null;
  ["mk","md","yr"].forEach(id => { $(id).value = ""; });
  $("md").disabled = $("yr").disabled = true;
  $("out").innerHTML = `<div class="pickhead">${logoHtml(q, "big")}
      <div><div class="pname">${bdi(q)}</div>
        <div class="pyr"><a class="see" target="_blank" rel="noopener"
          href="https://www.google.com/search?tbm=isch&q=${
          encodeURIComponent(q)}">${T("seeCar")}</a></div></div></div>
    <div class="verdict bad">
    <h2>${T("freeHead",{q:esc(q)})}</h2><p>${esc(T("freeP"))}</p></div>`
    + genericBlock(q);
  syncCards();
}

/* A shortcut for the question people ask most: what is already out there
   in numbers, and does it work? The cards are the fleet's own top ten, so
   the first thing on screen is the fleet rather than an empty form. */
function cards(){
  const top = (state.fleet.top || []).slice(0, 10);
  $("cards").innerHTML = `<h3 class="sec">${T("cardsHead")}</h3>
    <p class="lead">${esc(T("cardsLead"))}</p>
    <div class="cards">${top.map((c, n) => `
      <button class="card${state.cardOn === n ? " on" : ""}" data-n="${n}"
              aria-pressed="${state.cardOn === n}"
              title="${state.cardOn === n ? T("cardOpen") : ""}">
        ${c.g ? `<span class="lg card-lg">${pairSvg(1)}</span>`
              : logoHtml(c.mk || c.name, "card-lg")}
        <span class="cn">${bdi(c.mk || (c.g ? T("generic") : c.name))}</span>
        <span class="cm">${bdi(c.md || (c.g ? c.name : ""))}</span>
        <span class="cy">${c.y0 ? (c.y1 ? `${c.y0}\u2013${c.y1}` : `${c.y0}+`)
                                : T("anyYear")}</span>
        <span class="cd"><b>${c.devices.toLocaleString("en")}</b> ${T("devices")}</span>
      </button>`).join("")}</div>`;
}
function paintShare(b){ b.textContent = T("share"); }
$("cards").addEventListener("click", e => {
  const btn = e.target.closest(".card");
  if(!btn) return;
  const n = +btn.dataset.n;
  const c = (state.fleet.top || [])[n];
  if(!c) return;

  // A card that is already showing its answer closes on a second tap.
  // That is what people reach for first, and expecting them to find a
  // separate button for it was the wrong way round.
  if(state.cardOn === n){ clearAll(); return; }

  state.cardOn = n;
  cards();
  if(c.mk && c.md){
    // fill the pickers so the answer arrives the same way it would have
    // if the three fields had been worked through by hand
    $("mk").value = c.mk; state.models = modelsOf(c.mk);
    $("md").value = c.md; $("md").disabled = false;
    state.years = yearsOf(filesFor(c.mk, c.md));
    $("yr").value = ""; $("yr").disabled = false; $("yr").placeholder = T("allYears");
    state.pick = {mk:c.mk, md:c.md, yr:null}; state.free = "";
    $("free").value = "";
    renderPick();
  }else{
    $("free").value = c.name; renderFree();
  }
  $("out").scrollIntoView({behavior:"smooth", block:"start"});
});

/* The ten cards are a front door, and a front door has no business
   standing between a person and the room they are already in. Reached
   through the pickers or the free-text field, the answer takes the cards'
   place; Back or Clear brings them back. Opened FROM a card they stay,
   because the marked card is how a second tap closes it. */
function syncCards(){
  if(!state.fleet) return;
  $("cards").hidden = !!(state.pick || state.free)
    && (state.cardOn === null || state.cardOn === undefined);
}

/* ----------------------------------------------------------- panels */
function panels(){
  const m = state.meta, f = state.fleet;
  $("gauges").innerHTML = `
    <div class="gauge"><b>${m.files.toLocaleString("en")}</b> ${T("gFiles")}</div>
    <div class="gauge"><b>${m.fitted_devices.toLocaleString("en")}</b>
      ${T("gOf")} ${m.devices.toLocaleString("en")} ${T("gFitted")}</div>`;

  $("p-fleet").innerHTML = `<p class="lead">${esc(T("fleetLead"))}</p>
    <div class="list">${f.estate.map(r => `<div class="row">
      <span class="n">${r.devices.toLocaleString("en")}</span>
      <span>${esc((STATE_T[r.state]||[r.state,r.state])[L()])}</span></div>`).join("")}</div>
    <h3 class="sec">${T("topModels")}</h3>
    <div class="list">${f.top.slice(0,20).map(r => `<div class="row">
      <span class="n">${r.devices.toLocaleString("en")}</span>
      <span>${bdi(r.name)}</span></div>`).join("")}</div>`;

  const h = f.hints || {};
  const parts = Object.entries(LEADS).map(([kind, pair]) => {
    const rows = h[kind] || [];
    if(!rows.length) return "";
    const [title, why] = pair[L()];
    const total = rows.reduce((s,r) => s+r.devices, 0);
    return `<h3 class="sec">${esc(title)} — <b>${total}</b> ${T("devices")}</h3>
      <p class="lead">${esc(why)}</p>
      <div class="list">${rows.slice(0,12).map(r => `<div class="row">
        <span class="n">${r.devices}</span>
        <span>${bdi(r.make)}<span class="ev">${bdi(r.sample)}</span></span>
        ${r.now_on ? `<span class="why">${bdi(r.now_on)}</span>` : ""}
      </div>`).join("")}</div>`;
  }).join("");
  $("p-leads").innerHTML = (parts || `<p class="lead">${T("noLeads")}</p>`)
    + `<p class="lead" style="margin-top:20px">${esc(T("leadsNote"))}</p>`;

  const nf = m.new_files || [];
  $("p-new").innerHTML = nf.length
    ? `<p class="lead">${esc(T("newLead"))}</p>
       <div class="list">${nf.map(r => `<div class="row">
         <span>${bdi(r.name)}</span>
         <span class="why">${esc((r.since||"").slice(0,10))}</span>
       </div>`).join("")}</div>`
    : `<p class="lead">${T("noNew")}</p>`;

  $("stamp").textContent = T("stamp") + " " + m.generated_at;
}

/* ------------------------------------------------------- paint / lang */
function paint(){
  const ar = state.lang === "ar";
  $("ver").textContent = "v" + VERSION;
  document.documentElement.lang = ar ? "ar" : "en";
  document.documentElement.dir = ar ? "rtl" : "ltr";
  $("lang").textContent = ar ? "EN" : "عربي";
  document.querySelectorAll("[data-t]").forEach(el => {
    el.innerHTML = T(el.dataset.t);
  });
  $("mk").placeholder = T("pickAny");
  $("md").placeholder = $("md").disabled ? T("dash") : T("pickAny");
  $("yr").placeholder = $("yr").disabled ? T("dash") : T("allYears");
  $("free").placeholder = T("missPh");
  if(state.meta){ panels(); cards(); syncCards(); }
  if(state.free) renderFree(); else renderPick();
}

/* -------------------------------------------------------------- wires */
const cMk = combo("mk", {items: () => state.makes, pick: v => {
  state.pick = {mk:v}; state.free = "";
  if(state.cardOn !== null && state.cardOn !== undefined){
    state.cardOn = null; cards();
  }
  state.models = modelsOf(v);
  $("md").disabled = false; $("md").value = ""; $("md").placeholder = T("pickAny");
  $("yr").disabled = true;  $("yr").value = ""; $("yr").placeholder = T("dash");
  $("out").innerHTML = ""; $("free").value = "";
  $("md").focus();
}});
const cMd = combo("md", {items: () => state.models, pick: v => {
  state.pick = {...(state.pick||{}), md:v, yr:null};
  state.years = yearsOf(filesFor(state.pick.mk, v));
  $("yr").disabled = false; $("yr").value = ""; $("yr").placeholder = T("allYears");
  renderPick();
}});
const cYr = combo("yr", {items: () => state.years || [], pick: v => {
  state.pick = {...(state.pick||{}), yr:v || null};
  renderPick();
}});

function clearAll(focus){
  state.pick = null; state.free = ""; state.cardOn = null;
  if(state.fleet) cards();
  [cMk,cMd,cYr].forEach(c => c.clear());
  $("free").value = "";
  $("md").disabled = $("yr").disabled = true;
  $("md").placeholder = $("yr").placeholder = T("dash");
  $("out").innerHTML = "";
  syncCards();
  if(focus) $("mk").focus();
}
$("reset").addEventListener("click", () => clearAll(true));
let ft;
$("free").addEventListener("input", () => {
  clearTimeout(ft); ft = setTimeout(renderFree, 200);
});
/* Opening a row shows two different kinds of thing, and the difference is
   the whole point of this tool: what the catalogue promises, and what
   three real devices are actually sending right now. */
function detail(f){
  const chips = (f.s||[]).map(s => `<span class="s">${bdi(s)}</span>`).join("")
    + (f.x||[]).map(s => `<span class="s no">${bdi(s)}</span>`).join("");
  /* Once a fitted device is sending, the catalogue's promise stops being
     evidence and starts being noise: two long lists of signal names where
     only one of them is a fact. So the promise folds away wherever the
     installation already answered the question, and stays open wherever
     it is the only thing we have. */
  const proven = !!(f.lv && f.lv.r);
  const nDecl = (f.s||[]).length + (f.x||[]).length;
  const declBlock = `<div class="dh">${T("declared")}</div>
    <div class="chips">${chips || `<span class="s no">${T("noSig")}</span>`}</div>`;
  let html = `<div class="sensors">`;
  html += proven
    ? `<button class="dtog" data-dtog="${f.i}">${T("declShow", {n:nDecl})}</button>
       <div class="decl" hidden><div class="why">${T("declWhy")}</div>${declBlock}</div>`
    : declBlock;

  const devs = (f.lv && f.lv.d) || [];
  html += `<div class="dh">${T("devHead")}</div>`;
  html += devs.length ? devs.map(d => `<div class="dev">
      <div class="dhead">
        <span class="imei">${esc(d.i)}</span>
        ${d.u ? `<span class="unit">${bdi(d.u)}</span>` : ""}
        <span class="when">${esc(since(d.t))}</span>
      </div>
      ${(d.o || d.cb) ? `<div class="dwho">
        ${d.o ? `<span>${T("owner")}: <b>${bdi(d.o)}</b></span>` : ""}
        ${d.cb ? `<span>${T("creator")}: <b>${bdi(d.cb)}</b></span>` : ""}
      </div>` : ""}
      <div class="dcount">${T("liveCount", {
        n:(d.r||[]).filter(r => r.v !== undefined).length, t:(d.r||[]).length})}</div>
      <div class="chips">${(d.r||[]).map(r => r.v !== undefined
        ? `<span class="s">${bdi(r.n)} <b>${esc(r.v)}</b></span>`
        : `<span class="s quiet">${bdi(r.n)} <b>${T("silent")}</b></span>`
      ).join("") || `<span class="s no">${T("noSig")}</span>`}</div>
    </div>`).join("")
    : `<div class="empty">${T("noDevices")}</div>`;
  if(devs.length) html += `<div class="note">${esc(T("devNote"))}</div>`;
  return html + `</div>`;
}
$("out").addEventListener("click", e => {
  if(e.target.closest("#shr")){
    const t = state.shareText || "";
    if(navigator.share){ navigator.share({text: t}).catch(() => {}); }
    else if(navigator.clipboard){
      navigator.clipboard.writeText(t);
      const b = document.getElementById("shr");
      if(b){ b.textContent = T("copied"); setTimeout(() => paintShare(b), 2600); }
    }
    return;
  }
  if(e.target.closest("#back")){
    clearAll();
    $("cards").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  const tog = e.target.closest(".dtog");
  if(tog){
    const box = tog.parentElement.querySelector(".decl");
    box.hidden = !box.hidden;
    tog.textContent = box.hidden
      ? T("declShow", {n: box.querySelectorAll(".chips .s").length})
      : T("declHide");
    return;
  }
  const btn = e.target.closest(".sx");
  if(!btn) return;
  const f = state.v.find(x => x.i === +btn.dataset.sx);
  const li = btn.closest(".li");
  const open = li.querySelector(".sensors");
  if(open){ open.remove(); return; }
  li.insertAdjacentHTML("beforeend", detail(f));
});
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => {
      const on = t === tab;
      t.setAttribute("aria-selected", on);
      $(t.getAttribute("aria-controls")).hidden = !on;
    });
  });
});

function guideHTML(){
  const i = L();
  return `<h2>${esc(GUIDE.title[i])} <span class="ver">v${VERSION}</span></h2>
    <p class="gi">${esc(GUIDE.intro[i])}</p>`
    + GUIDE.sections.map(s => `<h3>${esc(s.h[i])}</h3><ul>${
        s.b.map(b => `<li>${esc(b[i])}</li>`).join("")}</ul>`).join("")
    + `<h3>${esc(GUIDE.whatsNew[i])}</h3>`
    + CHANGES.map((c, n) => `<div class="rel${n ? "" : " new"}">
        <div class="relh"><b>v${esc(c.v)}</b><span>${esc(c.d)}</span></div>
        <ul>${c.items.map(x => `<li>${esc(x[i])}</li>`).join("")}</ul></div>`).join("");
}
function openGuide(){
  $("guide-body").innerHTML = guideHTML();
  $("guide").hidden = false;
  $("guide-close").focus();
}
function closeGuide(){ $("guide").hidden = true; $("help").focus(); }
function downloadGuide(){
  const i = L();
  const page = `<!DOCTYPE html><html lang="${i ? "en" : "ar"}" dir="${i ? "ltr" : "rtl"}">
<meta charset="utf-8"><title>${esc(GUIDE.title[i])}</title>
<style>body{font:16px/1.7 "Segoe UI",system-ui,sans-serif;max-width:44em;
margin:40px auto;padding:0 20px;color:#111}h2{font-size:26px;margin:0 0 6px}
h3{font-size:17px;margin:26px 0 6px;border-bottom:1px solid #ddd;padding-bottom:4px}
.gi{color:#555}ul{padding-inline-start:20px}li{margin-bottom:7px}
.ver{font:600 14px monospace;color:#777}
.rel{border-inline-start:2px solid #ddd;padding-inline-start:12px;margin-bottom:14px}
.relh{display:flex;gap:10px;align-items:baseline}.relh b{font:600 14px monospace}
.relh span{font:11px monospace;color:#888}
footer{margin-top:34px;color:#777;font-size:13px}</style>
${guideHTML()}<footer>canval v${VERSION} — ${esc(state.meta ? state.meta.generated_at : "")}</footer>
</html>`;
  const url = URL.createObjectURL(new Blob([page], {type:"text/html;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = i ? "canval-guide.html" : "canval-دليل-الاستخدام.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
$("help").addEventListener("click", openGuide);
$("guide-close").addEventListener("click", closeGuide);
$("guide-dl").addEventListener("click", downloadGuide);
$("guide").addEventListener("click", e => { if(e.target.id === "guide") closeGuide(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("guide").hidden) closeGuide();
});

/* Remembering the two switches is the whole point of having them: a
   preference you have to set on every visit is not a preference. */
const save = (k,v) => { try{ localStorage.setItem("canval."+k, v); }catch(e){} };
const read = k => { try{ return localStorage.getItem("canval."+k); }catch(e){ return null; } };

function setZoom(z){
  if(z) document.documentElement.dataset.zoom = z;
  else delete document.documentElement.dataset.zoom;
  $("zoom").textContent = z === "2" ? "A++" : z === "1" ? "A+" : "A";
  save("zoom", z || "");
}
$("zoom").addEventListener("click", () => {
  const cur = document.documentElement.dataset.zoom || "";
  setZoom(cur === "" ? "1" : cur === "1" ? "2" : "");
});

function setTheme(mode){
  document.documentElement.dataset.theme = mode;
  $("th-moon").hidden = mode === "dark";
  $("th-sun").hidden  = mode !== "dark";
  save("theme", mode);
}
$("theme").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
$("lang").addEventListener("click", () => {
  state.lang = state.lang === "ar" ? "en" : "ar";
  save("lang", state.lang);
  paint();
});

state.lang = read("lang") || "ar";
setZoom(read("zoom") || "");
setTheme(read("theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
paint();
load();
</script>
