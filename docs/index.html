<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Colours off a CAN harness: ISO 11898 runs a twisted pair of yellow
   (CAN-H) and green (CAN-L). Those two wires are what this tool is about,
   so they are the only saturated colours on the page.

   Dark is not the light palette inverted. Both wire colours are lifted so
   they stay recognisable against a dark ground, and the ground is a warm
   charcoal rather than black so the yellow does not glare. */
:root{
  --ink:#101619; --paper:#E9ECE8; --panel:#fff; --line:#CFD5CE;
  --muted:#6A7580; --canh:#E0A106; --canl:#12734A; --alert:#A33227;
  --soft:#F5F6F4; --chip:#EEF3EF; --chipT:#20563C; --chipL:#D7E4DA;
  --chipN:#F7EDEC; --chipNT:#8A3229; --chipNL:#E9D2CF; --sel:#F0F2EF;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --ink:#E7EAE6; --paper:#15191B; --panel:#1C2124; --line:#2E3538;
  --muted:#95A0A6; --canh:#F0B93C; --canl:#3FA877; --alert:#E0705F;
  --soft:#222829; --chip:#1E2E27; --chipT:#7FCBA4; --chipL:#2C4438;
  --chipN:#33221F; --chipNT:#E39184; --chipNL:#4A2E29; --sel:#262D30;
}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background .18s ease,color .18s ease}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* ---------------- instrument bar ---------------- */
.bar{border-bottom:1px solid var(--line);background:var(--panel)}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-top:12px;padding-bottom:12px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:19px}
.brand span{color:var(--muted);font-weight:500;font-size:15px}
.gauges{margin-inline-start:auto;display:flex;gap:18px;flex-wrap:wrap}
.gauge{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.gauge b{color:var(--ink);font-weight:600;font-size:14px}
.tools{display:flex;gap:6px;align-items:center}
.tool{background:none;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:12px;
  font-weight:600;padding:5px 9px;line-height:1;display:flex;align-items:center;
  min-height:28px}
.tool:hover{border-color:var(--ink);color:var(--ink)}
.tool:focus-visible,.combo input:focus-visible,button:focus-visible{
  outline:2px solid var(--canh);outline-offset:2px}

/* ---------------- the three steps ---------------- */
.ask{padding:32px 0 8px}
.ask h1{margin:0 0 18px;font-size:clamp(24px,4vw,34px);font-weight:700;
  letter-spacing:-.03em;line-height:1.25}
.steps{display:grid;grid-template-columns:1.2fr 1.4fr .8fr auto;gap:10px;
  align-items:end}
@media(max-width:700px){.steps{grid-template-columns:1fr 1fr}}
.step label{display:block;font-family:var(--mono);font-size:11.5px;
  color:var(--muted);margin-bottom:5px;letter-spacing:.04em}

/* A dropdown of our own. The native datalist popup renders outside the
   page's world -- wrong width, wrong side, wrong colours in dark -- and
   there is no styling hook for it. This one is a box under its field. */
.combo{position:relative}
.combo input{
  width:100%;font-family:var(--sans);font-size:16px;font-weight:500;
  padding:12px 34px 12px 12px;border:1.5px solid var(--ink);border-radius:2px;
  background:var(--panel);color:var(--ink);
}
[dir="ltr"] .combo input{padding:12px 12px 12px 34px}
.combo input:disabled{border-color:var(--line);color:var(--muted);
  background:var(--soft);cursor:default}
.combo input::placeholder{color:var(--muted);font-weight:400;opacity:.75}
.combo .caret{position:absolute;inset-inline-end:12px;bottom:16px;
  pointer-events:none;color:var(--muted);font-size:10px;line-height:1}
.menu{
  position:absolute;z-index:40;inset-inline:0;top:calc(100% + 4px);
  max-height:min(340px,52vh);overflow-y:auto;background:var(--panel);
  border:1.5px solid var(--ink);border-radius:2px;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.35);
}
.menu[hidden]{display:none}
.opt{padding:9px 12px;cursor:pointer;font-size:15px;
  border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.opt:last-child{border-bottom:0}
.opt[aria-selected="true"],.opt:hover{background:var(--sel)}
.opt .c{margin-inline-start:auto;font-family:var(--mono);font-size:11.5px;
  color:var(--muted)}
.opt mark{background:none;color:inherit;font-weight:700;
  text-decoration:underline;text-underline-offset:2px}
.opt.none{color:var(--muted);cursor:default;font-size:14px}
.clear button{font-family:var(--sans);font-size:14px;padding:12px 16px;
  border:1.5px solid var(--line);background:var(--panel);border-radius:2px;
  cursor:pointer;color:var(--muted);white-space:nowrap}
.clear button:hover{border-color:var(--ink);color:var(--ink)}
.miss-line{margin:14px 0 0;font-size:13.5px;color:var(--muted)}
.miss-line input{font-family:var(--sans);font-size:14px;padding:7px 10px;
  margin-inline-start:8px;border:1px solid var(--line);border-radius:2px;
  background:var(--panel);color:var(--ink);width:min(320px,60vw)}

/* ---------------- verdict ---------------- */
.verdict{margin:26px 0 18px;background:var(--panel);border:1px solid var(--line);
  border-inline-start:4px solid var(--muted);border-radius:3px;padding:16px 18px}
.verdict.ok{border-inline-start-color:var(--canl)}
.verdict.warn{border-inline-start-color:var(--canh)}
.verdict.bad{border-inline-start-color:var(--alert)}
.verdict h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.verdict.ok h2{color:var(--canl)}
.verdict.bad h2{color:var(--alert)}
.verdict .nums{font-family:var(--mono);font-size:13px;color:var(--muted);
  margin-top:7px;display:flex;gap:18px;flex-wrap:wrap}
.verdict .nums b{color:var(--ink);font-size:16px;font-weight:600}
.verdict p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.verdict .live{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}

/* ---------------- the list ---------------- */
h3.sec{font-size:14px;font-weight:600;margin:24px 0 8px;color:var(--muted)}
h3.sec b{color:var(--ink)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  overflow:hidden}
.li{display:grid;grid-template-columns:44px 1fr auto auto auto auto;
  gap:0 16px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--soft)}
.li .pair{justify-self:center}
.li .nm{min-width:0}
.li .nm .t{font-weight:600;font-size:15px;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Latin names inside an Arabic page get torn apart by the bidi algorithm
   -- SPORTAGE renders as "TAGE SPOR" once a highlight splits it into two
   runs. Isolating every field that can hold a Latin name fixes it at the
   source, and bdi carries the direction for the ones built from pieces. */
.t,.d,.ev,.why,.num,.opt,.row span,.s,.dev{unicode-bidi:isolate}
bdi{unicode-bidi:isolate}
.li .nm .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:1px}
.lvl{font-family:var(--mono);font-size:11.5px;margin-top:2px}
.lvl.ok{color:var(--canl)}
.lvl.no{color:var(--alert)}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);
  text-align:center;min-width:58px}
.num b{display:block;font-size:15.5px;color:var(--ink);font-weight:600;line-height:1.3}
.num.zero b{color:var(--muted);font-weight:400}
.li .sx{background:none;border:1px solid var(--line);border-radius:2px;
  font-family:var(--sans);font-size:12.5px;color:var(--muted);cursor:pointer;
  padding:4px 10px;white-space:nowrap}
.li .sx:hover{border-color:var(--ink);color:var(--ink)}
.sensors{grid-column:1/-1;padding:12px 2px 4px}
.sensors .chips{display:flex;gap:6px;flex-wrap:wrap}
.dh{font-family:var(--mono);font-size:11px;color:var(--muted);
  letter-spacing:.04em;margin:0 0 6px}
.dev + .dev,.dh + .dev{margin-top:10px}
.dev{border:1px solid var(--line);border-radius:2px;padding:9px 11px;
  background:var(--soft)}
.dev + .dh,.chips + .dh{margin-top:14px}
.dhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.dhead .imei{font-family:var(--mono);font-size:13px;font-weight:600;
  letter-spacing:.02em}
.dhead .unit{font-size:12.5px;color:var(--muted)}
.dhead .when{margin-inline-start:auto;font-family:var(--mono);font-size:11.5px;
  color:var(--muted)}
.dev .s b{font-family:var(--mono);font-weight:600;margin-inline-start:4px}
.s{font-size:12.5px;padding:3px 9px;border-radius:2px;background:var(--chip);
  color:var(--chipT);border:1px solid var(--chipL)}
.s.no{background:var(--chipN);color:var(--chipNT);border-color:var(--chipNL)}
@media(max-width:640px){
  .li{grid-template-columns:36px 1fr auto auto}
  .li .num:nth-child(5),.li .num:nth-child(6){display:none}
}
.cfg .nm .t{font-family:var(--mono);font-weight:500;font-size:13px;
  white-space:normal;word-break:break-all}
.empty{padding:16px;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0;max-width:70ch}

/* ---------------- tabs ---------------- */
.tabs{display:flex;gap:4px;margin:40px 0 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;
  font-family:var(--sans);font-size:15px;font-weight:500;color:var(--muted);
  cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.panel{padding:20px 0 50px}
.panel[hidden]{display:none}
.row{display:flex;gap:14px;align-items:baseline;padding:10px 16px;
  border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .n{font-family:var(--mono);font-weight:600;min-width:64px}
.row .why{color:var(--muted);font-size:12.5px;margin-inline-start:auto;
  text-align:end;font-family:var(--mono)}
.lead{font-size:14px;color:var(--muted);margin:0 0 12px;max-width:64ch}
.ev{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block;
  margin-top:2px;word-break:break-all}
footer{border-top:1px solid var(--line);padding:16px 0 40px;font-size:13px;
  color:var(--muted)}
@media(prefers-reduced-motion:no-preference){
  .verdict,.list{animation:rise .2s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <div class="brand">canval <span data-t="tag"></span></div>
  <div class="gauges" id="gauges"></div>
  <div class="tools">
    <button class="tool" id="lang" type="button">EN</button>
    <button class="tool" id="theme" type="button" aria-label="theme">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none"
           stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path id="th-moon" d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z"/>
        <g id="th-sun" hidden><circle cx="10" cy="10" r="3.6"/>
          <path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M16 4l-1.4 1.4M5.4 14.6 4 16"/></g>
      </svg>
    </button>
  </div>
</div></div>

<main class="wrap">
  <section class="ask">
    <h1 data-t="h1"></h1>
    <div class="steps">
      <div class="step"><label id="l-mk" data-t="make"></label>
        <div class="combo" id="c-mk">
          <input id="mk" autocomplete="off" role="combobox" aria-expanded="false"
                 aria-controls="m-mk" aria-labelledby="l-mk">
          <span class="caret">&#9660;</span>
          <div class="menu" id="m-mk" role="listbox" hidden></div>
        </div></div>
      <div class="step"><label id="l-md" data-t="model"></label>
        <div class="combo" id="c-md">
          <input id="md" autocomplete="off" disabled role="combobox"
                 aria-expanded="false" aria-controls="m-md" aria-labelledby="l-md">
          <span class="caret">&#9660;</span>
          <div class="menu" id="m-md" role="listbox" hidden></div>
        </div></div>
      <div class="step"><label id="l-yr" data-t="year"></label>
        <div class="combo" id="c-yr">
          <input id="yr" autocomplete="off" disabled inputmode="numeric"
                 role="combobox" aria-expanded="false" aria-controls="m-yr"
                 aria-labelledby="l-yr">
          <span class="caret">&#9660;</span>
          <div class="menu" id="m-yr" role="listbox" hidden></div>
        </div></div>
      <div class="clear"><button id="reset" type="button" data-t="clear"></button></div>
    </div>
    <div class="miss-line"><span data-t="missLead"></span>
      <input id="free" type="search" autocomplete="off" spellcheck="false"></div>
  </section>

  <div id="out"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-fleet" aria-controls="p-fleet"
            aria-selected="true" data-t="tabFleet"></button>
    <button class="tab" role="tab" id="t-leads" aria-controls="p-leads"
            aria-selected="false" data-t="tabLeads"></button>
    <button class="tab" role="tab" id="t-new" aria-controls="p-new"
            aria-selected="false" data-t="tabNew"></button>
  </div>
  <section class="panel" id="p-fleet" role="tabpanel"></section>
  <section class="panel" id="p-leads" role="tabpanel" hidden></section>
  <section class="panel" id="p-new" role="tabpanel" hidden></section>
</main>

<footer class="wrap">
  <div id="stamp"></div>
  <div data-t="footNote"></div>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* Wrap anything that came out of the catalogue: those names are Latin,
   the page may be Arabic, and only an isolate keeps them whole. */
const bdi = s => `<bdi dir="${/[\u0600-\u06FF]/.test(s ?? "") ? "rtl" : "ltr"}">${esc(s)}</bdi>`;
const THIS_YEAR = new Date().getFullYear();
const state = {v:[], cfg:[], fleet:null, meta:null, makes:[], models:[], lang:"ar"};

/* ==================================================================== i18n
   Both languages are written out rather than shaped from one, so the
   English reads like English -- the audience is sales, and a phrase that
   survives translation word-for-word usually stops meaning anything. */
const STR = {
  tag:        ["— دعم الكان", "— CAN support"],
  h1:         ["هل العربية دي مدعومة؟", "Is this vehicle supported?"],
  make:       ["النوع", "MAKE"],
  model:      ["الموديل", "MODEL"],
  year:       ["السنة", "YEAR"],
  clear:      ["مسح", "Clear"],
  pickAny:    ["اكتب أو اختار", "Type or pick"],
  dash:       ["—", "—"],
  allYears:   ["كل السنوات", "All years"],
  missLead:   ["مش لاقي العربية في القوايم؟ يبقى مالهاش ملف — اكتب اسمها هنا وشوف العام:",
               "Not in the lists? Then it has no file of its own — type it here and check the generic:"],
  missPh:     ["مثلًا: CAMC", "e.g. CAMC"],
  noMatch:    ["مفيش نتيجة", "No match"],
  tabFleet:   ["الأسطول", "Fleet"],
  tabLeads:   ["شغل جاهز", "Ready work"],
  tabNew:     ["ملفات جديدة", "New files"],
  footNote:   ["عرض آخر الأجهزة المحدّثة جاي مع تسجيل الدخول.",
               "Showing the latest reporting devices needs sign-in; that comes next."],
  stamp:      ["آخر تحديث للبيانات:", "Data last refreshed:"],
  gFiles:     ["ملف كان", "CAN files"],
  gFitted:    ["جهاز عليه ملف", "devices carry one"],
  gOf:        ["من", "of"],
  vOk:        ["مدعومة — والبرو شايف منها إشارات",
               "Supported — the platform sees signals"],
  vDead:      ["مركّبة، لكن البرو مش شايف منها أي إشارة",
               "Installed, but the platform sees no signals at all"],
  vDeadP:     ["دي أقوى إشارة على مشكلة: الملف مسند والأجهزة موجودة على المنصة ومع ذلك مفيش حساسات بتوصل. تستاهل فحص فني.",
               "The strongest sign of a fault: the file is assigned, the devices are on the platform, and still nothing arrives. Worth a technician."],
  vPend:      ["مركّبة وشغّالة — التأكيد من البرو لسه",
               "Installed and reporting — sensor check still pending"],
  vPendP:     ["الأجهزة بتبعت، بس فحص الحساسات ما وصلهاش لسه. هيتحدّث مع المزامنة الجاية.",
               "The devices are sending, but the sensor check has not reached them yet. It updates with the next refresh."],
  vQuiet:     ["مركّبة، لكن من غير نشاط آخر ٣٠ يوم",
               "Installed, but nothing heard in 30 days"],
  vQuietP:    ["الملف مسند فعلًا، لكن الأجهزة دي ساكتة من شهر.",
               "The file is assigned, but these devices have been silent for a month."],
  vNever:     ["الملف موجود في الكتالوج، لكن مش مركّب على أي جهاز",
               "In the catalogue, never installed on anything"],
  vNeverP:    ["بحسب تعريفنا دي غير مدعومة فعليًا لحد أول تركيب ناجح. الملف جاهز للإسناد من المكتب.",
               "By our own definition that is not supported in practice yet. The file is ready to assign from the desk."],
  vYear:      ["سنة {y} خارج تغطية الملفات الموجودة", "{y} is outside every file's range"],
  vYearP:     ["الملفات بتغطي: {r}. جرّب سنة جواهم أو شوف العام تحت.",
               "The files cover: {r}. Try a year inside those, or see the generic below."],
  nFitted:    ["جهاز مركّب", "devices fitted"],
  nReporting: ["جهاز بيطلّع إشارات", "devices reporting"],
  nSignals:   ["إشارة واصلة", "signals arriving"],
  nChecked:   ["جهاز اتفحص", "devices checked"],
  nActive:    ["نشط آخر ٣٠ يوم", "active in 30 days"],
  nConfigs:   ["ملف إعداد", "configurations"],
  liveNote:   ["دي الإشارات اللي البرو قراها فعلًا من الأجهزة دي، مش اللي الكتالوج واعد بيه.",
               "These are signals the platform actually read from those devices, not what the catalogue promises."],
  filesFor:   ["ملفات الكان —", "CAN files —"],
  noFiles:    ["مفيش ملفات", "No files"],
  proOk:      ["البرو: {r} من {k} جهاز بيطلّع {s} إشارة",
               "Platform: {r} of {k} devices reporting {s} signals"],
  proNo:      ["البرو: {k} جهاز اتفحص، مفيش إشارات",
               "Platform: {k} devices checked, nothing reported"],
  nSig:       ["إشارة", "signals"],
  noSig:      ["مفيش إشارات معلنة", "No signals declared"],
  genTitle:   ["الطريق التاني — <b>البروتوكول العام</b>",
               "The other path — <b>the generic protocol</b>"],
  genNote:    ["المركبات التقيلة غالبًا بتتكلم البروتوكول العام حتى من غير ملف باسمها. عربيات الركاب نادرًا.",
               "Heavy vehicles usually speak the generic protocol even without a file of their own. Passenger cars rarely do."],
  cfgTitle:   ["إعدادات شغّالة على العام وفي اسمها «<b>{q}</b>»",
               "Configurations on the generic naming &ldquo;<b>{q}</b>&rdquo;"],
  cfgNote:    ["دي أقوى إشارة إن النوع ده اشتغل على العام قبل كده في الأسطول نفسه.",
               "The strongest sign this vehicle has already run on the generic in this very fleet."],
  cfgNone:    ["محدش في الأسطول جرّب الاسم ده على العام قبل كده — التجربة الميدانية هي اللي هتحسم.",
               "Nobody in the fleet has tried this name on the generic yet — only a field test will settle it."],
  onFile:     ["على", "on"],
  freeHead:   ["مفيش ملف باسم «{q}»", "No file named &ldquo;{q}&rdquo;"],
  freeP:      ["مش موجودة في كتالوج Xirgo، فالسؤال بقى: العام هيشغّلها؟",
               "Not in the Xirgo catalogue, so the question becomes: will the generic drive it?"],
  fleetLead:  ["إيه اللي متركّب في الأسطول، مقروء من إعدادات الأجهزة نفسها.",
               "What is installed across the fleet, read from the devices' own settings."],

/* ---------------------------------------------------------- folding */
const ALIAS = {"شاكمان":"shacman","شكمان":"shacman","مرسيدس":"mercedes",
"اكتروس":"actros","فولفو":"volvo","سكانيا":"scania","مان":"man","داف":"daf",
"ايفيكو":"iveco","هينو":"hino","فوسو":"fuso","كاماز":"kamaz",
"سينوتراك":"sinotruk","هوو":"howo","دونغفينغ":"dongfeng","فوتون":"foton",
"فاو":"faw","جاك":"jac","يوتونغ":"yutong","تويوتا":"toyota","هايس":"hiace",
"هايلكس":"hilux","نيسان":"nissan","ايسوزو":"isuzu","هيونداي":"hyundai",
"هونداي":"hyundai","كيا":"kia","فورد":"ford","شيفروليه":"chevrolet",
"بيجو":"peugeot","رينو":"renault","فيات":"fiat","دايو":"daewoo",
"ميتسوبيشي":"mitsubishi","اكسنت":"accent","النترا":"elantra","بيجاس":"pegas",
"سيراتو":"cerato","كورولا":"corolla","برادو":"prado"};
function fold(s){
  return (s||"").toString().toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/[ىئ]/g,"ي")
    .replace(/ؤ/g,"و").replace(/ء/g,"").replace(/[^\w\u0600-\u06FF]+/g," ").trim();
}
function terms(s){
  let t = " "+fold(s)+" ";
  for(const [a,l] of Object.entries(ALIAS)) t = t.split(a).join(" "+l+" ");
  return t.split(/\s+/).filter(w => w.length > 1);
}

/* ================================================== the dropdown itself */
function combo(id, opts){
  const input = $(id), menu = $("m-"+id), wrap = $("c-"+id);
  let items = [], active = -1, open = false;

  const draw = () => {
    const q = fold(input.value);
    const shown = (q ? items.filter(i => fold(i.label).includes(q)) : items).slice(0,300);
    if(!shown.length){
      menu.innerHTML = `<div class="opt none">${esc(T("noMatch"))}</div>`;
    }else{
      menu.innerHTML = shown.map((i,n) => {
        let label = esc(i.label);
        if(q){
          const at = fold(i.label).indexOf(q);
          if(at >= 0) label = esc(i.label.slice(0,at)) + "<mark>" +
            esc(i.label.slice(at,at+q.length)) + "</mark>" + esc(i.label.slice(at+q.length));
        }
        return `<div class="opt" role="option" data-v="${esc(i.value)}"
          aria-selected="${n === active}"><bdi dir="${
          /[\u0600-\u06FF]/.test(i.label) ? "rtl" : "ltr"}">${label}</bdi>${
          i.count ? `<span class="c">${i.count}</span>` : ""}</div>`;
      }).join("");
    }
    menu.querySelectorAll(".opt")[active]?.scrollIntoView({block:"nearest"});
  };
  const show = () => {
    items = opts.items(); active = -1; open = true;
    menu.hidden = false; input.setAttribute("aria-expanded","true"); draw();
  };
  const hide = () => {
    open = false; menu.hidden = true; input.setAttribute("aria-expanded","false");
  };
  const choose = v => {
    const hit = items.find(i => i.value === v);
    if(!hit) return;
    input.value = hit.label; hide(); opts.pick(hit.value);
  };

  input.addEventListener("focus", show);
  input.addEventListener("input", () => { open ? draw() : show(); });
  input.addEventListener("keydown", e => {
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      if(!open) return show();
      const n = menu.querySelectorAll(".opt[data-v]").length;
      if(!n) return;
      active = e.key === "ArrowDown" ? (active+1) % n : (active-1+n) % n;
      draw();
    }else if(e.key === "Enter"){
      const el = menu.querySelectorAll(".opt[data-v]")[active < 0 ? 0 : active];
      if(el){ e.preventDefault(); choose(el.dataset.v); }
    }else if(e.key === "Escape"){ hide(); }
  });
  menu.addEventListener("mousedown", e => {
    const el = e.target.closest(".opt[data-v]");
    if(el){ e.preventDefault(); choose(el.dataset.v); }
  });
  document.addEventListener("mousedown", e => {
    if(open && !wrap.contains(e.target)) hide();
  });
  return {clear(){ input.value = ""; hide(); }};
}

/* ------------------------------------------------------------- load */
async function load(){
  try{
    const [v,cfg,fleet,meta] = await Promise.all(
      ["vehicles","configs","fleet","meta"].map(n =>
        fetch("data/"+n+".json").then(r => {
          if(!r.ok) throw new Error(n); return r.json(); })));
    Object.assign(state,{v,cfg,fleet,meta});
    for(const x of state.cfg) x._h = fold(x.nm);
    buildMakes(); paint();
  }catch(e){
    $("out").innerHTML = `<div class="verdict bad"><h2>${T("dataMiss")}</h2>
      <p>${T("dataMissP",{f:esc(e.message)})}</p></div>`;
  }
}
function buildMakes(){
  const m = new Map();
  for(const v of state.v){
    if(v.g || !v.mk) continue;   // generic protocols are a path of their
    m.set(v.mk, (m.get(v.mk)||0) + (v.f ? 1 : 0));   // own, not a make
  }
  state.makes = [...m.keys()].sort()
    .map(k => ({value:k, label:k, count:m.get(k) || ""}));
}
function modelsOf(mk){
  const m = new Map();
  for(const v of state.v){
    if(v.g || v.mk !== mk) continue;
    const k = v.md || v.n;
    m.set(k, (m.get(k)||0) + v.f);
  }
  return [...m.keys()].sort().map(k => ({value:k, label:k, count:m.get(k) || ""}));
}
function filesFor(mk, md){
  return state.v.filter(v => !v.g && v.mk === mk && (v.md || v.n) === md);
}
function yearsOf(files){
  const y = new Set();
  for(const f of files){
    if(!f.y0) continue;
    for(let i = f.y0; i <= (f.y1 || THIS_YEAR); i++) y.add(i);
  }
  return [{value:"", label:T("allYears")}]
    .concat([...y].sort((a,b) => b-a).map(v => ({value:String(v), label:String(v)})));
}
const coverYear = (f,y) => !y || !f.y0 || (y >= f.y0 && y <= (f.y1 || THIS_YEAR));

/* -------------------------------------------------------- rendering */
function pairSvg(bus){
  const dash = bus === 2 ? 'stroke-dasharray="4 3"' : "";
  return `<svg class="pair" width="32" height="13" viewBox="0 0 34 14"
    aria-hidden="true" fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M1 4c4 0 4 6 8 6s4-6 8-6 4 6 8 6 4-6 8-6" stroke="var(--canh)" ${dash}/>
    <path d="M1 10c4 0 4-6 8-6s4 6 8 6 4-6 8-6 4 6 8 6" stroke="var(--canl)" ${dash}/>
  </svg>`;
}
/* Arabic counts a thing, two things, a few things and many things with
   four different words, and "من 2 ساعة" is what you get for ignoring that.
   Three lines of it here is cheaper than a stilted phrase on every row. */
const AR_UNITS = {
  m: ["دقيقة", "دقيقتين", "دقايق", "دقيقة"],
  h: ["ساعة", "ساعتين", "ساعات", "ساعة"],
  d: ["يوم", "يومين", "أيام", "يوم"],
};
function since(ts){
  if(!ts) return "—";
  const s = Math.max(0, Math.floor(Date.now()/1000) - ts);
  if(s < 90) return T("now");
  const [u, n] = s < 5400 ? ["m", Math.round(s/60)]
    : s < 172800 ? ["h", Math.round(s/3600)]
    : ["d", Math.round(s/86400)];
  if(state.lang !== "ar") return `${n}${u} ago`;
  const w = AR_UNITS[u];
  if(n === 1) return "من " + w[0];
  if(n === 2) return "من " + w[1];
  return "من " + n + " " + (n <= 10 ? w[2] : w[3]);
}

const num = (n,label) =>
  `<div class="num ${n ? "" : "zero"}"><b>${n ?? 0}</b>${label}</div>`;

function fileRow(f){
  const bits = [
    f.b ? "CAN"+f.b : "CAN?",
    f.y0 ? (f.y1 ? `${f.y0}\u2013${f.y1}` : `${f.y0}+`) : T("allYears"),
    f.kb ? f.kb+"kbps" : null,
    f.p ? "OBD "+f.p : null,
    f.r > 1 ? "rev "+f.r : null,
  ].filter(Boolean).join(" \u00b7 ");
  let live = "";
  if(f.lv && f.lv.r)
    live = `<div class="lvl ok">${T("proOk",{r:f.lv.r,k:f.lv.k,s:f.lv.s.length})}</div>`;
  else if(f.lv && f.lv.k)
    live = `<div class="lvl no">${T("proNo",{k:f.lv.k})}</div>`;
  return `<div class="li">
    ${pairSvg(f.b)}
    <div class="nm"><div class="t">${bdi(f.n)}</div>
      <div class="d">${esc(bits)}</div>${live}</div>
    ${num(f.f, T("devices"))}
    ${num(f.a, T("nActive"))}
    ${num(f.c, T("nConfigs"))}
    <button class="sx" data-sx="${f.i}">${(f.s||[]).length} ${T("nSig")}</button>
  </div>`;
}
function cfgRow(c){
  return `<div class="li cfg"><div></div>
    <div class="nm"><div class="t">${bdi(c.nm)}</div>
      <div class="d">${T("onFile")} ${bdi(c.fl)}</div></div>
    ${num(c.n, T("devices"))}${num(c.a, T("nActive"))}<div></div><div></div>
  </div>`;
}

/* The ladder, in the order the question is really settled:
   1. the platform saw signals                -> supported, proven
   2. installed and reporting, sensors unchecked
   3. installed, and the platform saw nothing  -> a real negative
   4. catalogued, never installed
   Live evidence beats install counts: a file on twenty parked trucks
   proves less than one truck actually sending fuel level. */
function liveOf(files){
  const s = new Set(); let asked=0, saw=0, reporting=0;
  for(const f of files){
    if(!f.lv) continue;
    asked += f.lv.n||0; saw += f.lv.k||0; reporting += f.lv.r||0;
    (f.lv.s||[]).forEach(x => s.add(x));
  }
  return {asked, saw, reporting, signals:[...s]};
}
function verdict(files, year){
  const inYear = files.filter(f => coverYear(f, year));
  const fitted = inYear.reduce((s,f) => s+f.f, 0);
  const active = inYear.reduce((s,f) => s+(f.a||0), 0);
  const cfgs   = inYear.reduce((s,f) => s+(f.c||0), 0);
  const lv     = liveOf(inYear);

  if(year && !inYear.length){
    const r = [...new Set(files.map(f => f.y0
      ? (f.y1 ? `${f.y0}\u2013${f.y1}` : `${f.y0}+`) : T("allYears")))].join("\u060c ");
    return {cls:"bad", h:T("vYear",{y:year}), nums:null,
            p:T("vYearP",{r}), inYear:files, lv};
  }
  if(lv.reporting)
    return {cls:"ok", h:T("vOk"), inYear, lv, p:null,
      nums:[[fitted,T("nFitted")],[lv.reporting,T("nReporting")],
            [lv.signals.length,T("nSignals")]]};
  if(fitted && lv.saw)
    return {cls:"bad", h:T("vDead"), inYear, lv, p:T("vDeadP"),
      nums:[[fitted,T("nFitted")],[lv.saw,T("nChecked")],[cfgs,T("nConfigs")]]};
  if(fitted && active)
    return {cls:"warn", h:T("vPend"), inYear, lv, p:T("vPendP"),
      nums:[[fitted,T("nFitted")],[active,T("nActive")],[cfgs,T("nConfigs")]]};
  if(fitted)
    return {cls:"warn", h:T("vQuiet"), inYear, lv, p:T("vQuietP"),
      nums:[[fitted,T("nFitted")],[cfgs,T("nConfigs")]]};
  return {cls:"bad", h:T("vNever"), nums:null, p:T("vNeverP"), inYear, lv};
}

function renderPick(){
  const {mk, md, yr} = state.pick || {};
  if(!mk || !md){ if(!state.free) $("out").innerHTML = ""; return; }
  const files = filesFor(mk, md);
  const v = verdict(files, yr ? +yr : null);

  let html = `<div class="verdict ${v.cls}"><h2>${esc(v.h)}</h2>`;
  if(v.nums) html += `<div class="nums">${v.nums
    .map(([n,l]) => `<span><b>${n}</b> ${esc(l)}</span>`).join("")}</div>`;
  if(v.p) html += `<p>${esc(v.p)}</p>`;
  if(v.lv.signals.length)
    html += `<div class="live">${v.lv.signals
      .map(s => `<span class="s">${bdi(s)}</span>`).join("")}</div>
      <p style="margin-top:6px">${esc(T("liveNote"))}</p>`;
  html += `</div>`;

  html += `<h3 class="sec">${T("filesFor")} <b>${bdi(mk + " " + md)}</b></h3>
    <div class="list">${v.inYear.map(fileRow).join("") ||
      `<div class="empty">${T("noFiles")}</div>`}</div>`;
  if(!v.inYear.some(f => f.f)) html += genericBlock(mk+" "+md);
  $("out").innerHTML = html;
}

function genericBlock(query){
  const gens = state.v.filter(v => v.g).sort((a,b) => b.f - a.f);
  const words = terms(query);
  const matched = words.length
    ? state.cfg.filter(c => words.some(w => c._h.includes(w))) : [];
  let html = `<h3 class="sec">${T("genTitle")}</h3>
    <div class="list">${gens.map(fileRow).join("")}</div>
    <div class="note">${esc(T("genNote"))}</div>
    <h3 class="sec">${T("cfgTitle",{q:esc(query)})}</h3>`;
  html += matched.length
    ? `<div class="list">${matched.slice(0,15).map(cfgRow).join("")}</div>
       <div class="note">${esc(T("cfgNote"))}</div>`
    : `<div class="list"><div class="empty">${esc(T("cfgNone"))}</div></div>`;
  return html;
}
function renderFree(){
  const q = $("free").value.trim();
  state.free = q;
  if(!q){ $("out").innerHTML = ""; return; }
  state.pick = null;
  ["mk","md","yr"].forEach(id => { $(id).value = ""; });
  $("md").disabled = $("yr").disabled = true;
  $("out").innerHTML = `<div class="verdict bad">
    <h2>${T("freeHead",{q:esc(q)})}</h2><p>${esc(T("freeP"))}</p></div>`
    + genericBlock(q);
}

  $("stamp").textContent = T("stamp") + " " + m.generated_at;

function paint(){
  const ar = state.lang === "ar";
  document.documentElement.lang = ar ? "ar" : "en";
  document.documentElement.dir = ar ? "rtl" : "ltr";
  $("lang").textContent = ar ? "EN" : "عربي";

  $("mk").placeholder = T("pickAny");
  $("md").placeholder = $("md").disabled ? T("dash") : T("pickAny");
  $("yr").placeholder = $("yr").disabled ? T("dash") : T("allYears");
  $("free").placeholder = T("missPh");
  if(state.meta) panels();
  if(state.free) renderFree(); else renderPick();
}

/* Opening a row shows two different kinds of thing, and the difference is
   the whole point of this tool: what the catalogue promises, and what
   three real devices are actually sending right now. */
function detail(f){
  const chips = (f.s||[]).map(s => `<span class="s">${bdi(s)}</span>`).join("")
    + (f.x||[]).map(s => `<span class="s no">${bdi(s)}</span>`).join("");
  let html = `<div class="sensors">
    <div class="dh">${T("declared")}</div>
    <div class="chips">${chips || `<span class="s no">${T("noSig")}</span>`}</div>`;

  const devs = (f.lv && f.lv.d) || [];
  html += `<div class="dh">${T("devHead")}</div>`;
  html += devs.length ? devs.map(d => `<div class="dev">
      <div class="dhead">
        <span class="imei">${esc(d.i)}</span>
        ${d.u ? `<span class="unit">${bdi(d.u)}</span>` : ""}
        <span class="when">${esc(since(d.t))}</span>
      </div>
      <div class="chips">${(d.r||[]).map(r =>
        `<span class="s">${bdi(r.n)} <b>${esc(r.v)}</b></span>`).join("")
        || `<span class="s no">${T("noSig")}</span>`}</div>
    </div>`).join("")
    : `<div class="empty">${T("noDevices")}</div>`;
  if(devs.length) html += `<div class="note">${esc(T("devNote"))}</div>`;
  return html + `</div>`;
}
$("out").addEventListener("click", e => {
  const btn = e.target.closest(".sx");
  if(!btn) return;
  const f = state.v.find(x => x.i === +btn.dataset.sx);
  const li = btn.closest(".li");
  const open = li.querySelector(".sensors");
  if(open){ open.remove(); return; }
  li.insertAdjacentHTML("beforeend", detail(f));
});
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => {
      const on = t === tab;
      t.setAttribute("aria-selected", on);
      $(t.getAttribute("aria-controls")).hidden = !on;
    });
  });
});

/* Remembering the two switches is the whole point of having them: a
   preference you have to set on every visit is not a preference. */
const save = (k,v) => { try{ localStorage.setItem("canval."+k, v); }catch(e){} };
const read = k => { try{ return localStorage.getItem("canval."+k); }catch(e){ return null; } };

function setTheme(mode){
  document.documentElement.dataset.theme = mode;
  $("th-moon").hidden = mode === "dark";
  $("th-sun").hidden  = mode !== "dark";
  save("theme", mode);
}
$("theme").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
$("lang").addEventListener("click", () => {
  state.lang = state.lang === "ar" ? "en" : "ar";
  save("lang", state.lang);
  paint();
});

state.lang = read("lang") || "ar";
setTheme(read("theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
paint();
load();
</script>
</body>
</html>
